# Code Generated by Sidekick is for learning and experimentation purposes only.
# filename: docker-compose.yml

services:

  localstack:
    image: localstack/localstack:3.4
    container_name: localstack
    ports:
      - "4566:4566"        # ✅ Keep — needed for AWS CLI debugging from host
    environment:
      - SERVICES=dynamodb,sqs
      - DEBUG=0
      - AWS_DEFAULT_REGION=ap-south-1
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - ibts-network

  redis:
    image: redis:7.2-alpine
    container_name: ibts-redis
    expose:
      - "6379"             # ✅ Internal only — gateway talks to it via Docker DNS
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - ibts-network

  mock-bank-server:
    image: wiremock/wiremock:3.5.4
    container_name: mock-bank-server
    expose:
      - "8080"             # ✅ Internal only — bank-adapter calls it via Docker DNS
    volumes:
      - ./bank-adapter/wiremock/mappings:/home/wiremock/mappings:ro
    command: ["--verbose"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/__admin/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    networks:
      - ibts-network

  idempotency-guard:
    build:
      context: ./idempotency-guard
      dockerfile: Dockerfile
    container_name: idempotency-guard
    expose:
      - "8080"             # ✅ Internal only — payment-switch calls it
    environment:
      - PYTHONUNBUFFERED=1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=ap-south-1
      - DYNAMODB_ENDPOINT_URL=http://localstack:4566
      - DYNAMODB_TABLE_NAME=IdempotencyRecords
      - IDEMPOTENCY_TTL_HOURS=24
    depends_on:
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - ibts-network

  bank-adapter:
    build:
      context: ./bank-adapter
      dockerfile: Dockerfile
    container_name: bank-adapter
    expose:
      - "8082"             # ✅ Internal only — payment-router calls it
    environment:
      - PYTHONUNBUFFERED=1
      - PRIMARY_TIMEOUT_SECONDS=3.0
      - FALLBACK_TIMEOUT_SECONDS=5.0
      - BREAKER_FAIL_MAX=3
      - BREAKER_RESET_TIMEOUT=30
    depends_on:
      mock-bank-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - ibts-network

  payment-router:
    build:
      context: ./payment-router
      dockerfile: Dockerfile
    container_name: payment-router
    expose:
      - "8081"             # ✅ Internal only — payment-switch calls it
    environment:
      - ENV=local
      - PYTHONUNBUFFERED=1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=ap-south-1
      - DYNAMO_ENDPOINT=http://localstack:4566
      - ROUTING_TABLE_NAME=routing-table
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_TTL_SECONDS=300
      - BANK_ADAPTER_URL=http://bank-adapter:8082/api/v1/adapter/send
    depends_on:
      localstack:
        condition: service_healthy
      redis:
        condition: service_healthy
      bank-adapter:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - ibts-network

  payment-switch:
    build:
      context: ./payment-switch
      dockerfile: Dockerfile
    container_name: payment-switch
    expose:
      - "8083"             # ✅ Internal only — api-gateway calls it
    environment:
      - PYTHONUNBUFFERED=1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=ap-south-1
      - DYNAMODB_ENDPOINT_URL=http://localstack:4566
      - DYNAMODB_TABLE_NAME=ibts-transactions
      - SQS_ENDPOINT_URL=http://localstack:4566
      - SQS_QUEUE_NAME=ibts-settlement-events
      - IDEMPOTENCY_GUARD_URL=http://idempotency-guard:8080
      - PAYMENT_ROUTER_URL=http://payment-router:8081
      - BANK_ADAPTER_URL=http://bank-adapter:8082
    depends_on:
      idempotency-guard:
        condition: service_healthy
      payment-router:
        condition: service_healthy
      bank-adapter:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - ibts-network

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8084:8084"        # ✅ THE ONLY PUBLIC PORT — everything flows through here
    environment:
      - PYTHONUNBUFFERED=1
      - PAYMENT_SWITCH_URL=http://payment-switch:8083
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=ibts-dev-secret-change-in-prod
      - API_KEY=ibts-api-key-dev
      - RL_PER_IP_REQUESTS=10
      - RL_PER_VPA_REQUESTS=10
      - RL_WINDOW_SECONDS=60
      - ENV=local
    depends_on:
      payment-switch:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - ibts-network

volumes:
  localstack_data:
  redis_data:

networks:
  ibts-network:
    driver: bridge
    name: ibts-network
