# Code Generated by Sidekick is for learning and experimentation purposes only.
# filename: docker-compose.yml

services:

  # ── Infrastructure ────────────────────────────────────────────────────────

  localstack:
    image: localstack/localstack:3.4
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=dynamodb
      - DEBUG=0
      - AWS_DEFAULT_REGION=ap-south-1
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - ibts-network

  redis:
    image: redis:7.2-alpine
    container_name: ibts-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - ibts-network

  # ── Mock Bank Server (WireMock) ───────────────────────────────────────────

  mock-bank-server:
    image: wiremock/wiremock:3.5.4
    container_name: mock-bank-server
    ports:
      - "8090:8080"                              # 8090 on host, 8080 inside container
    volumes:
      - ./bank-adapter/wiremock/mappings:/home/wiremock/mappings:ro
    command: ["--verbose"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/__admin/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    networks:
      - ibts-network

  # ── Service 3: idempotency-guard ──────────────────────────────────────────

  idempotency-guard:
    build:
      context: ./idempotency-guard
      dockerfile: Dockerfile
    container_name: idempotency-guard
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=ap-south-1
      - DYNAMODB_ENDPOINT_URL=http://localstack:4566
      - DYNAMODB_TABLE_NAME=IdempotencyRecords
      - IDEMPOTENCY_TTL_HOURS=24
    depends_on:
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - ibts-network

  # ── Service 4: payment-router ─────────────────────────────────────────────

  payment-router:
    build:
      context: ./payment-router
      dockerfile: Dockerfile
    container_name: payment-router
    ports:
      - "8081:8081"
    environment:
      - PYTHONUNBUFFERED=1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=ap-south-1
      - DYNAMO_ENDPOINT=http://localstack:4566
      - ROUTING_TABLE_NAME=routing-table
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_TTL_SECONDS=300
      - BANK_ADAPTER_URL=http://bank-adapter:8082/api/v1/adapter/send   # ← wired in
    depends_on:
      localstack:
        condition: service_healthy
      redis:
        condition: service_healthy
      bank-adapter:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - ibts-network

  # ── Service 5: bank-adapter ───────────────────────────────────────────────

  bank-adapter:
    build:
      context: ./bank-adapter
      dockerfile: Dockerfile
    container_name: bank-adapter
    ports:
      - "8082:8082"
    environment:
      - PYTHONUNBUFFERED=1
      - PRIMARY_TIMEOUT_SECONDS=3.0
      - FALLBACK_TIMEOUT_SECONDS=5.0
      - BREAKER_FAIL_MAX=3
      - BREAKER_RESET_TIMEOUT=30
    depends_on:
      mock-bank-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - ibts-network

