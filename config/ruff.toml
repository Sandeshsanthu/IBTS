line-length = 100
target-version = "py312"

[lint]
select = ["E","W","F","I","B","C4","UP","N","SIM","RUF"]
ignore = [
    "E501",
    "B008",
    "N803",
]
exclude = ["__pycache__/", ".venv/", "wiremock/", "localstack/"]

[lint.per-file-ignores]
"tests/*" = ["S101"]

[format]
quote-style = "double"
indent-style = "space"
line-ending  = "lf"