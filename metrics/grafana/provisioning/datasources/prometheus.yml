apiVersion: 1

datasources:
  - name:      Prometheus
    type:      prometheus
    access:    proxy
    url:       http://ibts-prometheus:9090
    isDefault: true
    editable:  false
    jsonData:
      timeInterval: "15s"
      queryTimeout: "60s"
      httpMethod:   POST
      exemplarTraceIdDestinations:
        - name:           trace_id
          datasourceUid:  jaeger    # ← was 'tempo', updated to match our Jaeger uid
