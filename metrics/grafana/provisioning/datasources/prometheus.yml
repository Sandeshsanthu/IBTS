apiVersion: 1

datasources:
  - name:      Prometheus
    type:      prometheus
    access:    proxy
    url:       http://ibts-prometheus:9090
    isDefault: true
    editable:  false
    jsonData:
      timeInterval:          "15s"
      queryTimeout:          "60s"
      httpMethod:            POST
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo   # wire up Tempo here when you add tracing
