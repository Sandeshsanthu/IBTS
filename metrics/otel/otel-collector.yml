# Code Generated by Sidekick is for learning and experimentation purposes only. filename: metrics/otel/otel-collector.yml

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256

  resource:
    attributes:
      - key: environment
        value: dev
        action: insert
      - key: project
        value: ibts
        action: insert

  batch:
    timeout: 1s
    send_batch_size: 512

exporters:
  otlp/jaeger:
    endpoint: ibts-jaeger:4317
    tls:
      insecure: true

  prometheus:
    endpoint: 0.0.0.0:8888

  debug:
    verbosity: normal

service:
  telemetry:
    metrics:
      address: 0.0.0.0:8889

  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp/jaeger, debug]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus, debug]
