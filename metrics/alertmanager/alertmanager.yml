# Code Generated by Sidekick is for learning and experimentation purposes only.
# filename: metrics/alertmanager/alertmanager.yml

global:
  resolve_timeout: 5m
  slack_api_url: "http://placeholder-slack-webhook"

route:
  receiver: default
  group_by:
    - alertname
    - category
    - service
    - bank_code
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h

  routes:
    - match:
        severity: p0
      receiver: slack-p0
      group_wait: 10s
      repeat_interval: 5m

    - match:
        severity: critical
      receiver: slack-critical
      group_wait: 10s
      repeat_interval: 5m
      continue: true

    - match:
        severity: warning
      receiver: slack-warning
      group_wait: 5m
      repeat_interval: 30m

    - match:
        team: security
      receiver: slack-security
      group_wait: 10s
      repeat_interval: 5m

    - match:
        team: platform
      receiver: slack-platform
      group_wait: 2m
      repeat_interval: 30m

inhibit_rules:
  - source_match:
      alertname: CircuitBreakerOpen
    target_match_re:
      alertname: BankLatencyHigh|BankFallbackSustained
    equal:
      - bank_code

  - source_match:
      alertname: RedisDown
    target_match_re:
      alertname: RedisCacheHitRatioLow|RedisHighLatency
    equal: []

  - source_match:
      alertname: PaymentVolumeZero
    target_match:
      alertname: PaymentVolumeDropped
    equal: []

receivers:
  - name: default
    slack_configs:
      - channel: "#ibts-alerts"
        title: "[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}"
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Severity:* {{ .Labels.severity }}
          *Service:* {{ .Labels.service }}
          *Bank:* {{ .Labels.bank_code }}
          *Category:* {{ .Labels.category }}
          {{ end }}
        send_resolved: true

  - name: slack-p0
    slack_configs:
      - channel: "#ibts-alerts-p0"
        color: "danger"
        title: "[P0] {{ .GroupLabels.alertname }}"
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Severity:* {{ .Labels.severity }}
          *Category:* {{ .Labels.category }}
          *Service:* {{ .Labels.service }}
          *Bank:* {{ .Labels.bank_code }}
          *Runbook:* {{ .Annotations.runbook }}
          {{ end }}
        send_resolved: true

  - name: slack-critical
    slack_configs:
      - channel: "#ibts-alerts-critical"
        color: "danger"
        title: "[CRITICAL] {{ .GroupLabels.alertname }}"
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Started:* {{ .StartsAt.Format "2006-01-02 15:04:05 UTC" }}
          *Runbook:* {{ .Annotations.runbook }}
          {{ end }}
        send_resolved: true

  - name: slack-warning
    slack_configs:
      - channel: "#ibts-alerts-warning"
        color: "warning"
        title: "[WARNING] {{ .GroupLabels.alertname }}"
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Service:* {{ .Labels.service }}
          *Bank:* {{ .Labels.bank_code }}
          {{ end }}
        send_resolved: true

  - name: slack-security
    slack_configs:
      - channel: "#ibts-alerts-security"
        color: "danger"
        title: "[SECURITY] {{ .GroupLabels.alertname }}"
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Runbook:* {{ .Annotations.runbook }}
          {{ end }}
        send_resolved: true

  - name: slack-platform
    slack_configs:
      - channel: "#ibts-alerts-platform"
        color: "warning"
        title: "[PLATFORM] {{ .GroupLabels.alertname }}"
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Service:* {{ .Labels.service }}
          {{ end }}
        send_resolved: true
