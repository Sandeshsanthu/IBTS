# Code Generated by Sidekick is for learning and experimentation purposes only.
# filename: metrics/docker-compose.yml

services:

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: ibts-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    networks:
      - ibts-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: ibts-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER:                  admin
      GF_SECURITY_ADMIN_PASSWORD:              ibts-grafana-dev
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/ibts_overview.json
      GF_ALERTING_ENABLED:                     "false"
      GF_UNIFIED_ALERTING_ENABLED:             "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - ibts-network
    depends_on:
      - prometheus
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: ibts-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--cluster.listen-address="
    networks:
      - ibts-network
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.59.0
    container_name: ibts-redis-exporter
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: "redis://ibts-redis:6379"
    networks:
      - ibts-network
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:

networks:
  ibts-network:
    external: true
