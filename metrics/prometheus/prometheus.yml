# Code Generated by Sidekick is for learning and experimentation purposes only.
# filename: metrics/prometheus/prometheus.yml

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local
    system: ibts

rule_files:
  - "alerts/payment_alerts.yml"
  - "alerts/payment_p0_alerts.yml"
  - "alerts/sla_alerts.yml"
  - "alerts/infrastructure_alerts.yml"
  - "alerts/local_test_alert.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: api-gateway
    honor_labels: true
    static_configs:
      - targets: ["api-gateway:8084"]
    relabel_configs:
      - target_label: service
        replacement: api-gateway

  - job_name: payment-switch
    honor_labels: true
    static_configs:
      - targets: ["payment-switch:8083"]
    relabel_configs:
      - target_label: service
        replacement: payment-switch

  - job_name: payment-router
    honor_labels: true
    static_configs:
      - targets: ["payment-router:8081"]
    relabel_configs:
      - target_label: service
        replacement: payment-router

  - job_name: idempotency-service
    honor_labels: true
    static_configs:
      - targets: ["idempotency-guard:8080"]
    relabel_configs:
      - target_label: service
        replacement: idempotency-service

  - job_name: bank-adapter
    honor_labels: true
    static_configs:
      - targets: ["bank-adapter:8082"]
    relabel_configs:
      - target_label: service
        replacement: bank-adapter

  - job_name: redis-exporter
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-exported-metrics
    honor_labels: true
    static_configs:
      - targets: ["ibts-otel-collector:8888"]
    relabel_configs:
      - target_label: service
        replacement: otel-exported-metrics

  - job_name: otel-collector-telemetry
    honor_labels: true
    static_configs:
      - targets: ["ibts-otel-collector:8889"]
    relabel_configs:
      - target_label: service
        replacement: otel-collector
