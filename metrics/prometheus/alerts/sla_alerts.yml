# Code Generated by Sidekick is for learning and experimentation purposes only.
# filename: metrics/prometheus/alerts/sla_alerts.yml

groups:

  - name: latency_sla
    rules:

      - alert: PaymentP95LatencyBreached
        expr: |
          histogram_quantile(0.95,
            sum by (le, payee_bank)(
              rate(ibts_payment_end_to_end_latency_seconds_bucket[5m])
            )
          ) > 3.0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "p95 payment latency >3s for {{ $labels.payee_bank }} ({{ $value | humanizeDuration }})"

      - alert: PaymentP99LatencyBreached
        expr: |
          histogram_quantile(0.99,
            sum by (le)(
              rate(ibts_payment_end_to_end_latency_seconds_bucket[5m])
            )
          ) > 5.0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "p99 payment latency >5s -- SLA breach ({{ $value | humanizeDuration }})"

      - alert: BankLatencyHigh
        expr: |
          histogram_quantile(0.99,
            sum by (le, bank_code, endpoint_type)(
              rate(ibts_bank_request_latency_seconds_bucket[5m])
            )
          ) > 2.0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.bank_code }} {{ $labels.endpoint_type }} p99 >2s -- breaker may trip soon"

  - name: rate_limiting
    rules:

      - alert: RateLimitSpiking
        expr: sum(rate(ibts_rate_limit_hits_total[1m])) > 10
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Rate limit hitting >10 rejections/s -- possible client loop or DDoS"

      - alert: AuthFailureSpike
        expr: sum(rate(ibts_auth_failures_total[5m])) > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Auth failures >5/s -- check key rotation or scanning"
