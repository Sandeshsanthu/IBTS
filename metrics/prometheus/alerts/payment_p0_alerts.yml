# Code Generated by Sidekick is for learning and experimentation purposes only.
# filename: metrics/prometheus/alerts/payment_p0_alerts.yml

groups:
  - name: ibts_payment_p0
    interval: 30s
    rules:
      - alert: PaymentSuccessRateP0
        expr: |
          (
            sum(increase(ibts_payment_initiated_total{status="SUCCESS"}[5m]))
            /
            clamp_min(
              sum(increase(ibts_payment_initiated_total[5m])),
              1
            )
          ) < 0.70
          and
          sum(increase(ibts_payment_initiated_total[5m])) >= 30
        for: 5m
        labels:
          severity: p0
          team: payments
          category: payment-availability
        annotations:
          summary: "P0: payment success rate below 70%"
          description: "Payment success rate is {{ $value | humanizePercentage }} over the last five minutes."
          runbook: "payment-success-rate"


      - alert: PaymentStateCorruptionP0
          expr: |
            sum by (service, violation) (
              increase(ibts_payment_state_corruption_total[1m])
            ) > 0
          for: 15s
          labels:
            severity: p0
            team: payments
            category: payment-integrity
          annotations:
            summary: "P0: payment state corruption detected"
            description: "A confirmed payment state integrity violation occurred."
            runbook: "payment-state-integrity"

      - alert: DuplicateDebitP0
          expr: |
          sum by (service, detection_type) (
                  increase(ibts_duplicate_debit_total[5m])
                ) > 0
              for: 15s
              labels:
                severity: p0
                team: payments
                category: payment-integrity
              annotations:
                summary: "P0: duplicate debit detected"
                description: "A confirmed payment appears to have produced multiple successful debits."
                runbook: "duplicate-debit"