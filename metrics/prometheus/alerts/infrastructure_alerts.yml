# Code Generated by Sidekick is for learning and experimentation purposes only.
# filename: metrics/prometheus/alerts/infrastructure_alerts.yml

groups:

  - name: redis
    rules:

      - alert: RedisDown
        expr: redis_up == 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Redis is DOWN -- route cache and idempotency cache unavailable"

      - alert: RedisCacheHitRatioLow
        expr: ibts_route_cache_hit_ratio < 0.7
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Route cache hit ratio below 70% ({{ $value | humanizePercentage }}) -- high DynamoDB load"

      - alert: RedisHighLatency
        expr: |
          histogram_quantile(0.99,
            rate(ibts_redis_operation_latency_seconds_bucket[5m])
          ) > 0.05
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Redis p99 latency >50ms"

  - name: dynamodb
    rules:

      - alert: DynamoHighLatency
        expr: |
          histogram_quantile(0.99,
            sum by (le, table, operation)(
              rate(ibts_dynamo_operation_latency_seconds_bucket[5m])
            )
          ) > 0.1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "DynamoDB {{ $labels.table }}.{{ $labels.operation }} p99 >100ms"

      - alert: DynamoThrottling
        expr: |
          rate(
            ibts_dynamo_errors_total{error_type="ProvisionedThroughputExceeded"}[5m]
          ) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "DynamoDB throttling on {{ $labels.table }} -- increase capacity"
