# Code Generated by Sidekick is for learning and experimentation purposes only.
# filename: metrics/prometheus/alerts/payment_alerts.yml

groups:

  - name: payment_volume
    interval: 30s
    rules:

      - alert: PaymentSuccessRateLow
        expr: |
          (
            sum(rate(ibts_payment_initiated_total{status="SUCCESS"}[5m]))
            /
            sum(rate(ibts_payment_initiated_total[5m]))
          ) < 0.95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Payment success rate below 95% (current={{ $value | humanizePercentage }})"

      - alert: PaymentVolumeDropped
        expr: |
          (
            sum(rate(ibts_payment_initiated_total[5m]))
            /
            sum(rate(ibts_payment_initiated_total[5m] offset 5m))
          ) < 0.8
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Payment volume dropped >20% vs 5 min ago"

      - alert: PaymentVolumeZero
        expr: sum(rate(ibts_payment_initiated_total[3m])) == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Zero payments processed in last 3 minutes"

  - name: circuit_breaker
    rules:

      - alert: CircuitBreakerOpen
        expr: ibts_circuit_breaker_state > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Circuit breaker OPEN for {{ $labels.bank_code }} (state={{ $value }})"

      - alert: CircuitBreakerFlapping
        expr: |
          increase(
            ibts_circuit_breaker_transitions_total{transition="closed_to_open"}[30m]
          ) >= 3
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.bank_code }} breaker tripped 3+ times in 30 min"

      - alert: BankFallbackSustained
        expr: rate(ibts_bank_fallback_used_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.bank_code }} primary endpoint degraded - fallback in sustained use"

  - name: idempotency
    rules:

      - alert: HighDuplicateRate
        expr: |
          (
            sum(rate(ibts_idempotency_checks_total{idem_result="CACHED"}[5m]))
            /
            sum(rate(ibts_idempotency_checks_total[5m]))
          ) > 0.3
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Duplicate request rate >30% -- possible client retry loop"

      - alert: StaleProcessingKeys
        expr: rate(ibts_idempotency_stale_processing_total[5m]) > 0.01
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Idempotency keys stuck in PROCESSING -- check for crashed transactions"
