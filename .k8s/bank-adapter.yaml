# filename: .k8s/bank-adapter/deployment.yaml | Code Generated by Sidekick is for learning and experimentation purposes only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-adapter
  namespace: ibts-app
  labels:
    app: bank-adapter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bank-adapter
  template:
    metadata:
      labels:
        app: bank-adapter
        logging: "true"
    spec:
      automountServiceAccountToken: false
      containers:
        - name: bank-adapter
          image: sandeshs/ibts-bank-adapter:b2cad14536e18c2ab3c6ef70e6ee7934f332964b
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: ibts-shared-config
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PRIMARY_TIMEOUT_SECONDS
              value: "3.0"
            - name: FALLBACK_TIMEOUT_SECONDS
              value: "5.0"
            - name: BREAKER_FAIL_MAX
              value: "3"
            - name: BREAKER_RESET_TIMEOUT
              value: "30"
            - name: OTEL_SERVICE_NAME
              value: bank-adapter
            - name: MOCK_BANK_URL
              value: "http://mock-bank-server.ibts-app.svc.cluster.local:8080"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: bank-adapter
  namespace: ibts-app
  labels:
    app: bank-adapter
spec:
  type: ClusterIP
  selector:
    app: bank-adapter
  ports:
    - name: http
      port: 8082
      targetPort: http

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: bank-adapter
  namespace: ibts-app
  labels:
    app: bank-adapter
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: bank-adapter
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
