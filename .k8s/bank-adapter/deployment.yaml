apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-adapter
  namespace: ibts-app
  labels:
    app: bank-adapter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bank-adapter
  template:
    metadata:
      labels:
        app: bank-adapter
        logging: "true"
    spec:
      containers:
        - name: bank-adapter
          image: sandeshs/ibts-bank-adapter:63f878b4cf3540cd3d45de3f3d9c25d047e16262
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PRIMARY_TIMEOUT_SECONDS
              value: "3.0"
            - name: FALLBACK_TIMEOUT_SECONDS
              value: "5.0"
            - name: BREAKER_FAIL_MAX
              value: "3"
            - name: BREAKER_RESET_TIMEOUT
              value: "30"
            - name: OTEL_SERVICE_NAME
              value: "bank-adapter"
          envFrom:
            - configMapRef:
                name: ibts-shared-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          # Aligned precisely with your Docker compose config rule
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: bank-adapter
  namespace: ibts-app
  labels:
    app: bank-adapter
spec:
  selector:
    app: bank-adapter
  ports:
    - name: http
      protocol: TCP
      port: 8082
      targetPort: http
