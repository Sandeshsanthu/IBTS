# filename: .k8s/api-gateway/deployment.yaml
# Code Generated by Sidekick is for learning and experimentation purposes only.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ibts-app
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        logging: "true"
    spec:
      containers:
        - name: api-gateway
          image: sandeshs/ibts-api-gateway:9e391d56cf13c4663f3b86d6789a3fa0e01307cd
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8084
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PAYMENT_SWITCH_URL
              value: http://payment-switch.ibts-app.svc.cluster.local:8083
            - name: REDIS_HOST
              value: ibts-redis.ibts-app.svc.cluster.local
            - name: REDIS_PORT
              value: "6379"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-gateway-secrets
                  key: JWT_SECRET
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-gateway-secrets
                  key: API_KEY
            - name: RL_PER_IP_REQUESTS
              value: "10"
            - name: RL_PER_VPA_REQUESTS
              value: "10"
            - name: RL_WINDOW_SECONDS
              value: "60"
            - name: OTEL_SERVICE_NAME
              value: api-gateway
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector-opentelemetry-collector.ibts-observability.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
            - name: OTEL_PYTHON_LOG_CORRELATION
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ibts-app
  labels:
    app: api-gateway
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8084
      targetPort: http

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api-gateway
  namespace: ibts-app
  labels:
    app: api-gateway
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: api-gateway
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
