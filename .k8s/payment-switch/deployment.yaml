# filename: .k8s/payment-switch/deployment.yaml
# Code Generated by Sidekick is for learning and experimentation purposes only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-switch
  namespace: ibts-app
  labels:
    app: payment-switch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-switch
  template:
    metadata:
      labels:
        app: payment-switch
        logging: "true"
    spec:
      serviceAccountName: payment-switch
      containers:
        - name: payment-switch
          image: sandeshs/ibts-payment-switch:1c77a02e1f3680a07a7eb1ef87d4e6e35f9e0443
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
          envFrom:
            - configMapRef:
                name: ibts-shared-config
          env:
            - name: AWS_MODE
              value: "true"
            - name: DYNAMODB_TABLE_NAME
              valueFrom:
                configMapKeyRef:
                  name: ibts-shared-config
                  key: DYNAMODB_TABLE_NAME_TRANSACTIONS
            - name: PYTHONPATH
              value: /service
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: OTEL_SERVICE_NAME
              value: payment-switch
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: payment-switch
  namespace: ibts-app
  labels:
    app: payment-switch
spec:
  type: ClusterIP
  selector:
    app: payment-switch
  ports:
    - name: http
      port: 8083
      targetPort: http
