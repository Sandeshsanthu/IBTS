# Code Generated by Sidekick is for learning and experimentation purposes only.
# filename: k8s/redis.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: ibts-app
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: gp3
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ibts-redis
  namespace: ibts-app
  labels:
    app: ibts-redis
spec:
  replicas: 1
  strategy:
    type: Recreate            # RWO EBS volume: never run old and new pods together
  selector:
    matchLabels:
      app: ibts-redis
  template:
    metadata:
      labels:
        app: ibts-redis
        logging: "true"
    spec:
      containers:
        - name: ibts-redis
          image: redis:7.2-alpine
          args: ["--maxmemory", "400mb", "--maxmemory-policy", "noeviction"]
          ports:
            - containerPort: 6379
              name: redis-port
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - name: redis-data
              mountPath: /data
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.55.0-alpine
          env:
            - name: REDIS_ADDR
              value: redis://localhost:6379
          ports:
            - containerPort: 9121
              name: metrics
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 100m, memory: 128Mi }
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ibts-redis
  namespace: ibts-app
  labels:
    app: ibts-redis
spec:
  selector:
    app: ibts-redis
  ports:
    - name: redis-port
      port: 6379
      targetPort: redis-port
    - name: metrics
      port: 9121
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1     # fixed
kind: ServiceMonitor
metadata:
  name: ibts-redis-monitor
  namespace: ibts-app
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: ibts-redis
  endpoints:
    - port: metrics
      interval: 15s
      path: /metrics
