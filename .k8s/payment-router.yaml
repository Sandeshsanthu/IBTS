# filename: .k8s/payment-router/deployment.yaml
# Code Generated by Sidekick is for learning and experimentation purposes only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-router
  namespace: ibts-app
  labels:
    app: payment-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-router
  template:
    metadata:
      labels:
        app: payment-router
        logging: "true"
    spec:
      serviceAccountName: payment-router
      containers:
        - name: payment-router
          image: sandeshs/ibts-payment-router:e3b7870036107c3e53c6e945ca7ff98e8848f1f8
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: ibts-shared-config
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: CACHE_TTL_SECONDS
              value: "300"
            - name: OTEL_SERVICE_NAME
              value: payment-router
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: payment-router
  namespace: ibts-app
  labels:
    app: payment-router
spec:
  type: ClusterIP
  selector:
    app: payment-router
  ports:
    - name: http
      port: 8081
      targetPort: http

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: payment-router
  namespace: ibts-app
  labels:
    app: payment-router
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: payment-router
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
