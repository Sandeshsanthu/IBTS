name: "IBTS API Gateway Deploy"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm running this deployment'
        required: true
        type: string
        default: "no"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "ap-south-2"
  CLUSTER_NAME: "ibts-eks"

jobs:
  deploy-api-gateway:
    name: "Deploy Api-Gateway Service"
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Confirmation
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "yes" ]; then
            echo "Deployment halted: confirmation was not yes."
            exit 1
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::149614785419:role/github-actions-terraform-role"
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: "ApiGatewayDeploy"

      - name: Connect to EKS Cluster
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"

      # ✅ ADDED: Ensure the application namespace exists first
      - name: Ensure Namespace Exists
        run: |
          kubectl create namespace ibts-app --dry-run=client -o yaml | kubectl apply -f -

      # ✅ ADDED: Inject secrets from GitHub Actions Secrets before deployment
      # Note: Make sure to add PROD_API_KEY and PROD_JWT_SECRET to your GitHub Repo Secrets
      - name: Create or Update Kubernetes Secrets
        env:
          API_KEY: ${{ secrets.PROD_API_KEY }}
          JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
        run: |
          kubectl create secret generic api-gateway-secrets \
            -n ibts-app \
            --from-literal=API_KEY="$API_KEY" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Validate manifests (server-side dry run)
        run: kubectl apply --dry-run=server -f .k8s/api-gateway

      - name: Apply Kubernetes Manifests
        run: kubectl apply -f .k8s/api-gateway/

      - name: Wait for rollout
        run: kubectl -n ibts-app rollout status deploy/api-gateway --timeout=180s

      - name: Post-deploy validation checks
        run: |
          kubectl -n ibts-app get pods,svc,endpoints -l app=api-gateway
