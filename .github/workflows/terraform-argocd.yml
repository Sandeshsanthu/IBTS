# Code Generated by Sidekick is for learning and experimentation purposes only.
# filename: .github/workflows/terraform-argocd.yml

name: "IBTS ArgoCD Deployment"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm running this ArgoCD deployment'
        required: true
        type: string
        default: "no"
      action:
        description: "apply installs/updates ArgoCD, destroy removes it"
        required: true
        type: choice
        options:
          - apply
          - destroy
        default: apply
      argocd_version:
        description: "argo-cd helm chart version"
        required: true
        type: string
        default: "7.7.0"
      argocd_apps_version:
        description: "argocd-apps helm chart version"
        required: true
        type: string
        default: "2.0.2"
      auto_sync:
        description: "Automated sync + self-heal (leave false for the first run)"
        required: true
        type: boolean
        default: false
      auto_prune:
        description: "Let Argo CD delete resources removed from Git (only works with auto_sync)"
        required: true
        type: boolean
        default: false

concurrency:
  group: ibts-stage4-argocd
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "ap-south-2"
  CLUSTER_NAME: "ibts-eks"
  TF_DIR: infra-aws/inital/stage4-argocd
  TF_VAR_aws_region: "ap-south-2"
  TF_VAR_cluster_name: "ibts-eks"
  TF_VAR_git_repo_url: ${{ github.server_url }}/${{ github.repository }}.git
  TF_VAR_git_revision: "main"
  TF_VAR_app_path: ".k8s/overlays/production"
  TF_VAR_argocd_chart_version: ${{ inputs.argocd_version }}
  TF_VAR_argocd_apps_chart_version: ${{ inputs.argocd_apps_version }}
  TF_VAR_auto_sync: ${{ inputs.auto_sync }}
  TF_VAR_auto_prune: ${{ inputs.auto_prune }}
  TF_CLI_ARGS_plan: "-lock-timeout=3m"
  TF_CLI_ARGS_apply: "-lock-timeout=3m"

jobs:
  # =========================================
  # STAGE 4 PLAN
  # =========================================
  stage4-plan:
    name: "Stage 4 Plan (ArgoCD)"
    if: inputs.confirm == 'yes'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Check input combinations
        env:
          AUTO_SYNC: ${{ inputs.auto_sync }}
          AUTO_PRUNE: ${{ inputs.auto_prune }}
        run: |
          if [ "$AUTO_PRUNE" = "true" ] && [ "$AUTO_SYNC" != "true" ]; then
            echo "::error::auto_prune only takes effect together with auto_sync. Set auto_sync=true or auto_prune=false."
            exit 1
          fi
          if [ "$AUTO_PRUNE" = "true" ]; then
            echo "::warning::auto_prune=true: Argo CD will delete anything in ibts-app that is not in Git (including PVCs defined in redis.yaml if you remove them)."
          fi

      - name: Repo must be public (no Argo repo credential is configured)
        env:
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$PRIVATE" = "true" ]; then
            echo "::error::This repo is private but stage 4 has no repository credential. Make it public or add the credential back."
            exit 1
          fi

      - name: Backend config sanity check
        working-directory: ${{ env.TF_DIR }}
        run: |
          if grep -q 'REPLACE-WITH' backend.tf; then
            echo "::error::backend.tf still has the placeholder bucket name. Put the real stage 1 bucket in infra-aws/inital/stage4-argocd/backend.tf."
            exit 1
          fi
          grep -E '^[[:space:]]*(bucket|key|region|use_lockfile|dynamodb_table)[[:space:]]*=' backend.tf

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::149614785419:role/github-actions-terraform-role"
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: "Stage4Plan"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Configure kubectl context
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"

      - name: Preflight - cluster access
        run: |
          kubectl cluster-info
          kubectl -n kube-system get deployment coredns
          if [ "$(kubectl auth can-i '*' '*' --all-namespaces)" != "yes" ]; then
            echo "::error::The AWS role is not cluster-admin. Helm needs it to install CRDs and cluster roles."
            exit 1
          fi

      - name: Preflight - bootstrap objects Argo CD depends on
        if: inputs.action == 'apply'
        env:
          AUTO_SYNC: ${{ inputs.auto_sync }}
        run: |
          missing=0
          if kubectl -n ibts-app get secret api-gateway-secrets >/dev/null 2>&1; then
            echo "OK: api-gateway-secrets exists"
          else
            echo "::warning::api-gateway-secrets is missing. Run the ibts-bootstrap workflow first."
            missing=1
          fi
          if kubectl -n ibts-app get configmap wiremock-mappings >/dev/null 2>&1; then
            echo "OK: wiremock-mappings exists"
          else
            echo "::warning::wiremock-mappings is missing. Run the ibts-bootstrap workflow first."
            missing=1
          fi
          if kubectl get crd servicemonitors.monitoring.coreos.com >/dev/null 2>&1; then
            echo "OK: ServiceMonitor CRD present"
          else
            echo "::warning::ServiceMonitor CRD missing. That object will fail to sync."
          fi
          # With auto-sync on, missing bootstrap objects mean crashing pods, so stop here.
          if [ "$AUTO_SYNC" = "true" ] && [ "$missing" = "1" ]; then
            echo "::error::auto_sync=true but bootstrap objects are missing. Run ibts-bootstrap, or use auto_sync=false."
            exit 1
          fi

      - name: Verify the chart versions exist
        if: inputs.action == 'apply'
        env:
          V1: ${{ inputs.argocd_version }}
          V2: ${{ inputs.argocd_apps_version }}
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update
          helm show chart argo/argo-cd --version "$V1" | head -8
          helm show chart argo/argocd-apps --version "$V2" | head -8
          echo "--- 'applications' must be a map (not a list) in this argocd-apps version ---"
          helm show values argo/argocd-apps --version "$V2" | grep -n -A6 '^applications:' || true

      - name: Validate the Kustomize build (same flag Argo CD will use)
        if: inputs.action == 'apply'
        run: |
          kubectl kustomize .k8s/overlays/production --load-restrictor LoadRestrictionsNone > /tmp/rendered.yaml
          echo "Rendered objects:"
          grep -E '^(kind|  name):' /tmp/rendered.yaml | paste - - | sort | uniq -c
          if grep -E '^kind:[[:space:]]*Secret$' /tmp/rendered.yaml; then
            echo "::error::A Secret is rendered from Git. Remove it and rotate the value."
            exit 1
          fi

      - name: Init
        run: terraform init -input=false
        working-directory: ${{ env.TF_DIR }}

      - name: Format check
        run: terraform fmt -check -diff
        working-directory: ${{ env.TF_DIR }}

      - name: Validate
        run: terraform validate
        working-directory: ${{ env.TF_DIR }}

      - name: Plan
        env:
          ACTION: ${{ inputs.action }}
        working-directory: ${{ env.TF_DIR }}
        run: |
          if [ "$ACTION" = "destroy" ]; then
            terraform plan -destroy -refresh=true -input=false -out=tfplan-stage4
          else
            terraform plan -refresh=true -input=false -out=tfplan-stage4
          fi

      # The lock file is a hidden file, so include-hidden-files is required.
      # Apply must use the exact provider versions the plan was made with.
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-stage4
          path: |
            ${{ env.TF_DIR }}/tfplan-stage4
            ${{ env.TF_DIR }}/.terraform.lock.hcl
          include-hidden-files: true
          retention-days: 1

  # =========================================
  # STAGE 4 APPLY
  # =========================================
  stage4-apply:
    name: "Stage 4 Apply (ArgoCD)"
    needs: stage4-plan
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::149614785419:role/github-actions-terraform-role"
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: "Stage4Apply"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Configure kubectl context
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"

      - uses: actions/download-artifact@v4
        with:
          name: tfplan-stage4
          path: ${{ env.TF_DIR }}

      - name: Init
        run: terraform init -input=false
        working-directory: ${{ env.TF_DIR }}

      - name: Apply
        run: terraform apply -input=false tfplan-stage4
        working-directory: ${{ env.TF_DIR }}

      - name: Wait for Argo CD components
        if: inputs.action == 'apply'
        run: |
          for d in argocd-server argocd-repo-server argocd-applicationset-controller; do
            kubectl -n argocd rollout status deployment/$d --timeout=300s
          done
          kubectl -n argocd rollout status statefulset/argocd-application-controller --timeout=300s

      - name: Verify Kustomize setting reached argocd-cm
        if: inputs.action == 'apply'
        run: |
          VALUE="$(kubectl -n argocd get cm argocd-cm -o jsonpath='{.data.kustomize\.buildOptions}')"
          echo "kustomize.buildOptions = '$VALUE'"
          if [ "$VALUE" != "--load-restrictor LoadRestrictionsNone" ]; then
            echo "::error::kustomize.buildOptions is not set. Your base/kustomization.yaml (../redis.yaml etc.) will fail with a ComparisonError."
            exit 1
          fi

      - name: Show ibts-app status
        if: inputs.action == 'apply'
        run: |
          sleep 45
          kubectl -n argocd get application ibts-app
          echo "--- sync / health ---"
          kubectl -n argocd get application ibts-app \
            -o jsonpath='{.status.sync.status} / {.status.health.status}{"\n"}'
          echo "--- conditions (errors show here, e.g. ComparisonError) ---"
          kubectl -n argocd get application ibts-app \
            -o jsonpath='{range .status.conditions[*]}{.type}: {.message}{"\n"}{end}'
          echo "--- resources ---"
          kubectl -n argocd get application ibts-app \
            -o jsonpath='{range .status.resources[*]}{.kind}/{.name}: {.status} {.health.status}{"\n"}{end}'

      - name: Diagnostics on failure
        if: failure() && inputs.action == 'apply'
        run: |
          kubectl -n argocd get pods,svc -o wide || true
          kubectl -n argocd logs deploy/argocd-server --tail=100 || true
          kubectl -n argocd logs deploy/argocd-repo-server --tail=100 || true
          kubectl -n argocd describe application ibts-app || true
