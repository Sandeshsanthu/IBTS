name: "IBTS Mock Bank Server Deploy"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm running this deployment'
        required: true
        type: string
        default: "no"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "ap-south-2"
  CLUSTER_NAME: "ibts-eks"

jobs:
  deploy-mock-bank:
    name: "Deploy Mock Bank Server"
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Confirmation
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "yes" ]; then
            echo "Deployment halted: confirmation was not yes."
            exit 1
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::149614785419:role/github-actions-terraform-role"
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: "MockBankDeploy"

      - name: Connect to EKS Cluster
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"

      - name: Ensure namespace exists
        run: kubectl create namespace ibts-app --dry-run=client -o yaml | kubectl apply -f -

      - name: Sync WireMock mappings ConfigMap
        run: |
          ls -la bank-adapter/wiremock/mappings
          kubectl -n ibts-app create configmap wiremock-mappings \
            --from-file=bank-adapter/wiremock/mappings \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Validate manifests (server-side dry run)
        run: kubectl apply --dry-run=server -f .k8s/mock-bank-server/

      - name: Apply Kubernetes Manifests
        run: kubectl apply -f .k8s/mock-bank-server/

      - name: Restart so WireMock reloads mappings
        run: kubectl -n ibts-app rollout restart deploy/mock-bank-server

      - name: Wait for rollout
        run: kubectl -n ibts-app rollout status deploy/mock-bank-server --timeout=180s

      - name: Post-deploy checks
        run: |
          kubectl -n ibts-app get pods,svc,endpoints -l app=mock-bank-server
          kubectl -n ibts-app get configmap wiremock-mappings
