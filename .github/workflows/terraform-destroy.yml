# filename: .github/workflows/terraform-destroy.yml
# Code Generated by Sidekick is for learning and experimentation purposes only.

name: "Terraform Destroy (Manual Only)"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DESTROY to confirm you want to delete all resources"
        required: true
        default: ""

concurrency:
  group: terraform-environment
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  # ════════════════════════════════════════
  # SAFETY CHECK — must type DESTROY to proceed
  # ════════════════════════════════════════
  safety-check:
    name: "Safety Check"
    runs-on: ubuntu-latest

    steps:
      - name: Validate Confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DESTROY" ]; then
            echo "❌ You must type DESTROY to confirm"
            echo "You typed: ${{ github.event.inputs.confirm }}"
            exit 1
          fi
          echo "✅ Confirmed — proceeding with destroy"

  # ════════════════════════════════════════
  # STAGE 2 DESTROY — k8s resources first
  # Must destroy stage2 before stage1
  # (cluster must exist while k8s resources are deleted)
  # ════════════════════════════════════════
  stage2-destroy:
    name: "Destroy Stage 2 (K8s Config)"
    needs: safety-check
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: "ap-south-1"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate with AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::149614785419:role/github-actions-terraform-role"
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: "TerraformStage2Destroy"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init
        working-directory: infra-aws/inital/stage2-config

      # 🟢 CLEAN STEP: Drops dead Kubernetes/Helm references so Terraform skips API lookups
      - name: Clean Orphaned Kubernetes State
        run: |
          echo "Checking state for components..."
          terraform state rm data.aws_eks_cluster.this || true
          terraform state rm kubernetes_namespace.ibts_observability || true
          
          # Dynamic cleanup for any remaining kubernetes or helm provider resources
          REMAINING_K8S=$(terraform state list 2>/dev/null | grep -E "kubernetes_|helm_" || true)
          if [ ! -z "$REMAINING_K8S" ]; then
            echo "Removing residual resources from state:"
            echo "$REMAINING_K8S"
            terraform state rm $REMAINING_K8S || true
          fi
        working-directory: infra-aws/inital/stage2-config

      - name: Terraform Destroy Stage 2
        run: terraform destroy -auto-approve
        working-directory: infra-aws/inital/stage2-config

      - name: Confirm Stage 2 Destroyed
        run: |
          echo "══════════════════════════════════════"
          echo "STAGE 2 STATE AFTER DESTROY:"
          terraform state list 2>/dev/null \
            && echo "⚠️  some resources still in state" \
            || echo "✅ state is empty"
          echo "══════════════════════════════════════"
        working-directory: infra-aws/inital/stage2-config

  # ════════════════════════════════════════
  # STAGE 1 DESTROY — cluster + VPC
  # Runs only after stage2 is fully gone
  # ════════════════════════════════════════
  stage1-destroy:
    name: "Destroy Stage 1 (Cluster + VPC)"
    needs: stage2-destroy
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: "ap-south-1"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate with AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::149614785419:role/github-actions-terraform-role"
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: "TerraformStage1Destroy"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init
        working-directory: infra-aws/inital/stage1-cluster

      # 🟢 CLEAN STEP FOR STAGE 1: Drop the cluster if Stage 1 still tries to target it directly
      - name: Clean Orphaned Cluster State
        run: |
          terraform state rm aws_eks_cluster.this || true
          terraform state rm aws_eks_cluster.ibts-eks || true
        working-directory: infra-aws/inital/stage1-cluster

      - name: Terraform Destroy Stage 1
        run: terraform destroy -auto-approve
        working-directory: infra-aws/inital/stage1-cluster

      - name: Confirm Stage 1 Destroyed
        run: |
          echo "══════════════════════════════════════"
          echo "STAGE 1 STATE AFTER DESTROY:"
          terraform state list 2>/dev/null \
            && echo "⚠️  some resources still in state" \
            || echo "✅ state is empty"
          echo "══════════════════════════════════════"
        working-directory: infra-aws/inital/stage1-cluster

  # ════════════════════════════════════════
  # SUMMARY
  # ════════════════════════════════════════
  destroy-summary:
    name: "Destroy Summary"
    needs: [stage2-destroy, stage1-destroy]
    runs-on: ubuntu-latest

    steps:
      - name: Print Summary
        run: |
          echo "══════════════════════════════════════════"
          echo "✅ ALL RESOURCES DESTROYED"
          echo ""
          echo "Stage 2 (k8s config)  → destroyed"
          echo "Stage 1 (cluster+VPC) → destroyed"
          echo ""
          echo "To rebuild: push any commit to main"
          echo "══════════════════════════════════════════"
