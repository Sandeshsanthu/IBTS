# filename: .github/workflows/terraform-destroy.yml
# Code Generated by Sidekick is for learning and experimentation purposes only.

name: "Terraform Destroy (Manual Only)"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DESTROY to confirm you want to delete all resources"
        required: true
        default: ""

concurrency:
  group: terraform-environment
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "ap-south-2"
  CLUSTER_NAME: "ibts-eks"

jobs:
  # ════════════════════════════════════════
  # SAFETY CHECK
  # ════════════════════════════════════════
  safety-check:
    name: "Safety Check"
    runs-on: ubuntu-latest

    steps:
      - name: Validate Confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DESTROY" ]; then
            echo "❌ You must type DESTROY to confirm"
            echo "You typed: ${{ github.event.inputs.confirm }}"
            exit 1
          fi
          echo "✅ Confirmed — proceeding with destroy"

  # ════════════════════════════════════════
  # STAGE 2 DESTROY — k8s resources first
  # ════════════════════════════════════════
  stage2-destroy:
    name: "Destroy Stage 2 (K8s Config)"
    needs: safety-check
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::149614785419:role/github-actions-terraform-role"
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: "TerraformStage2Destroy"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Install kubectl and helm
        run: |
          curl -fsSL \
            "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl" \
            -o /usr/local/bin/kubectl
          chmod +x /usr/local/bin/kubectl
          curl -fsSL \
            https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 \
            | bash

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.CLUSTER_NAME }} 2>/dev/null || \
            echo "EKS cluster not reachable -- continuing anyway"

      - name: Force-clean namespace before destroy
        run: |
          echo "==> Uninstalling Helm releases"
          for release in kube-prometheus-stack elasticsearch kibana \
                         otel-collector jaeger fluent-bit; do
            helm uninstall "$release" -n ibts-observability \
              --wait=false --ignore-not-found 2>/dev/null || true
          done

          echo "==> Deleting PVCs"
          kubectl delete pvc --all -n ibts-observability \
            --force --grace-period=0 2>/dev/null || true

          echo "==> Deleting pods"
          kubectl delete pods --all -n ibts-observability \
            --force --grace-period=0 2>/dev/null || true

          echo "==> Stripping finalizers"
          for resource in persistentvolumeclaims pods statefulsets \
                          deployments replicasets daemonsets; do
            kubectl get "$resource" -n ibts-observability \
              -o name 2>/dev/null | while read obj; do
              kubectl patch "$obj" -n ibts-observability \
                --type=json \
                -p='[{"op":"remove","path":"/metadata/finalizers"}]' \
                2>/dev/null || true
            done
          done

          echo "==> Stripping namespace finalizer"
          kubectl patch namespace ibts-observability \
            --type=json \
            -p='[{"op":"remove","path":"/metadata/finalizers"}]' \
            2>/dev/null || true

          echo "==> Force-deleting namespace"
          kubectl delete namespace ibts-observability \
            --force --grace-period=0 2>/dev/null || true

          echo "==> Waiting 15s for namespace to clear"
          sleep 15

      - name: Init
        run: terraform init
        working-directory: infra-aws/inital/stage2-config

      - name: Destroy
        run: terraform destroy -auto-approve
        working-directory: infra-aws/inital/stage2-config

      - name: Confirm
        run: |
          echo "══════════════════════════════════════"
          echo "STAGE 2 STATE AFTER DESTROY:"
          terraform state list 2>/dev/null \
            && echo "⚠️  some resources still in state" \
            || echo "✅ state is empty"
          echo "══════════════════════════════════════"
        working-directory: infra-aws/inital/stage2-config

  # ════════════════════════════════════════
  # STAGE 1 DESTROY — cluster + VPC
  # ════════════════════════════════════════
  stage1-destroy:
    name: "Destroy Stage 1 (Cluster + VPC)"
    needs: stage2-destroy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::149614785419:role/github-actions-terraform-role"
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: "TerraformStage1Destroy"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Init
        run: terraform init
        working-directory: infra-aws/inital/stage1-cluster

      - name: Destroy
        run: terraform destroy -auto-approve
        working-directory: infra-aws/inital/stage1-cluster

      - name: Confirm
        run: |
          echo "══════════════════════════════════════"
          echo "STAGE 1 STATE AFTER DESTROY:"
          terraform state list 2>/dev/null \
            && echo "⚠️  some resources still in state" \
            || echo "✅ state is empty"
          echo "══════════════════════════════════════"
        working-directory: infra-aws/inital/stage1-cluster

  # ════════════════════════════════════════
  # SUMMARY
  # ════════════════════════════════════════
  destroy-summary:
    name: "Destroy Summary"
    needs: [stage2-destroy, stage1-destroy]
    runs-on: ubuntu-latest

    steps:
      - name: Print Summary
        run: |
          echo "══════════════════════════════════════════"
          echo "✅ ALL RESOURCES DESTROYED"
          echo ""
          echo "Stage 2 (k8s config)  → destroyed"
          echo "Stage 1 (cluster+VPC) → destroyed"
          echo ""
          echo "To rebuild: push any commit to main"
          echo "══════════════════════════════════════════"
