name: "IBTS Redis Deploy"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm running this Redis deployment'
        required: true
        type: string
        default: "no"

# Enforce a concurrency group to prevent structural overlaps during simultaneous runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "ap-south-2"
  CLUSTER_NAME: "ibts-eks"

jobs:
  deploy-redis:
    name: "Deploy Redis Manifests"
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Guard step enforcing runtime input validation
      - name: Check Confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "yes" ]; then
            echo "Deployment halted: input confirmation was not verified as 'yes'."
            exit 1
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::149614785419:role/github-actions-terraform-role"
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: "RedisManifestDeploy"

      - name: Connect to EKS Cluster
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

      # Applies your deployment.yaml and service.yaml configurations into the cluster
      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -f .k8s/redis/
