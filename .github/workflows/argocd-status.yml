# Code Generated by Sidekick is for learning and experimentation purposes only.
# filename: .github/workflows/argocd-status.yml

name: "IBTS ArgoCD Status (read-only)"

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "ap-south-2"
  CLUSTER_NAME: "ibts-eks"

jobs:
  status:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::149614785419:role/github-actions-terraform-role"
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: "ArgoStatus"

      - name: Connect to EKS
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"

      - name: Wait up to 3 minutes for Synced
        run: |
          kubectl -n argocd annotate application ibts-app argocd.argoproj.io/refresh=hard --overwrite
          for i in $(seq 1 18); do
            S="$(kubectl -n argocd get application ibts-app -o jsonpath='{.status.sync.status}/{.status.health.status}/{.status.operationState.phase}')"
            echo "attempt $i: sync/health/operation = $S"
            case "$S" in Synced/Healthy/*) break;; esac
            sleep 10
          done

      - name: Is ignoreDifferences present on the Application?
        run: |
          kubectl -n argocd get application ibts-app -o jsonpath='{.spec.syncPolicy}{"\n"}{.spec.ignoreDifferences}{"\n"}'
          echo "(empty second line = the ignore rule was NOT rendered by the chart)"

      - name: Full last operation
        run: kubectl -n argocd get application ibts-app -o jsonpath='{.status.operationState}{"\n"}'

      - name: Argo CD's own diff (core mode, no server login)
        continue-on-error: true
        run: |
          curl -sSL -o argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd
          kubectl config set-context --current --namespace=argocd
          ./argocd login --core
          ./argocd app diff ibts-app --core || true

      - name: Controller log lines about the two Deployments
        continue-on-error: true
        run: |
          kubectl -n argocd logs statefulset/argocd-application-controller --tail=300 \
            | grep -E 'api-gateway|mock-bank-server' | tail -20 || true
