# filename: .github/workflows/terraform-bootstrap.yml
# Code Generated by Sidekick is for learning and experimentation purposes only.

name: "Terraform Bootstrap (Manual One-Time Fix)"

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  import-stage2:
    name: "Import Existing IAM Resources Into Stage2 State"
    runs-on: ubuntu-latest
    env:
      AWS_REGION: "ap-south-2"
      ACCOUNT_ID: "149614785419"
      CLUSTER_NAME: "ibts-eks"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Authenticate with AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: "arn:aws:iam::149614785419:role/github-actions-terraform-role"
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: "TerraformBootstrap"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init
        working-directory: infra-aws/inital/stage2-config

      # ── IAM Policies
      - name: Import IAM Policy - payment-switch
        working-directory: infra-aws/inital/stage2-config
        run: |
          terraform import \
            aws_iam_policy.payment_switch \
            arn:aws:iam::149614785419:policy/ibts-eks-payment-switch-policy \
            && echo "✅ done" || echo "⏭️  already in state"

      - name: Import IAM Policy - payment-router
        working-directory: infra-aws/inital/stage2-config
        run: |
          terraform import \
            aws_iam_policy.payment_router \
            arn:aws:iam::149614785419:policy/ibts-eks-payment-router-policy \
            && echo "✅ done" || echo "⏭️  already in state"

      - name: Import IAM Policy - idempotency-guard
        working-directory: infra-aws/inital/stage2-config
        run: |
          terraform import \
            aws_iam_policy.idempotency_guard \
            arn:aws:iam::149614785419:policy/ibts-eks-idempotency-guard-policy \
            && echo "✅ done" || echo "⏭️  already in state"

      # ── IAM Roles (IRSA)
      - name: Import IRSA Role - payment-switch
        working-directory: infra-aws/inital/stage2-config
        run: |
          terraform import \
            'module.irsa_payment_switch.aws_iam_role.this[0]' \
            ibts-eks-payment-switch \
            && echo "✅ done" || echo "⏭️  already in state"

      - name: Import IRSA Role - payment-router
        working-directory: infra-aws/inital/stage2-config
        run: |
          terraform import \
            'module.irsa_payment_router.aws_iam_role.this[0]' \
            ibts-eks-payment-router \
            && echo "✅ done" || echo "⏭️  already in state"

      - name: Import IRSA Role - idempotency-guard
        working-directory: infra-aws/inital/stage2-config
        run: |
          terraform import \
            'module.irsa_idempotency_guard.aws_iam_role.this[0]' \
            ibts-eks-idempotency-guard \
            && echo "✅ done" || echo "⏭️  already in state"

      # ── SQS Queue (already created successfully)
      - name: Import SQS Queue
        working-directory: infra-aws/inital/stage2-config
        run: |
          terraform import \
            aws_sqs_queue.karpenter_interruption \
            https://sqs.ap-south-2.amazonaws.com/149614785419/ibts-eks-karpenter-interruption \
            && echo "✅ done" || echo "⏭️  already in state"

      - name: Import SQS Queue Policy
        working-directory: infra-aws/inital/stage2-config
        run: |
          terraform import \
            aws_sqs_queue_policy.karpenter_interruption \
            https://sqs.ap-south-2.amazonaws.com/149614785419/ibts-eks-karpenter-interruption \
            && echo "✅ done" || echo "⏭️  already in state"

      - name: Import cluster_creator Access Entry
        working-directory: infra-aws/inital/stage1-cluster
        run: |
          terraform import \
            'module.eks.aws_eks_access_entry.this["cluster_creator"]' \
            'ibts-eks:arn:aws:iam::149614785419:role/github-actions-terraform-role' \
            && echo "✅ done" || echo "⏭️  already in state"

      - name: Show State List
        working-directory: infra-aws/inital/stage2-config
        run: |
          echo "══════════════════════════════════════"
          echo "STAGE2 STATE AFTER IMPORTS:"
          terraform state list
          echo "══════════════════════════════════════"
