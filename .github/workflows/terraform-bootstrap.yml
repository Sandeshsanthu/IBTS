# filename: .github/workflows/terraform-bootstrap.yml
# Code Generated by Sidekick is for learning and experimentation purposes only.
#
# PURPOSE : One-time fix to import existing AWS resources into the
#           new state path and correct version drift.
#
# TRIGGER : Manual only (workflow_dispatch).
#           This file NEVER runs automatically.
#           It will NOT interfere with your existing pipeline.
#
# AFTER   : Once this runs successfully, you can leave this file
#           in the repo — it does nothing unless you manually trigger it.

name: "Terraform Bootstrap (Manual One-Time Fix)"

on:
  workflow_dispatch:    # manual trigger ONLY — never runs on push or PR

permissions:
  id-token: write
  contents: read

jobs:
  bootstrap:
    name: "Import + Refresh Existing Resources"
    runs-on: ubuntu-latest
    env:
      AWS_REGION: "ap-south-1"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate with AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::149614785419:role/github-actions-terraform-role"
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: "GitHubActionsTerraformBootstrap"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      # Init connects to the NEW key path: ibts-eks/terraform.tfstate
      # This path is currently empty in S3 — that is expected
      # We are about to populate it via imports below
      - name: Terraform Init
        run: terraform init
        working-directory: infra-aws/inital

      # ── IMPORT EXISTING RESOURCES ──────────────────────────────────────
      # Each import tells Terraform "this resource already exists in AWS"
      # || true means: if not found or already imported → skip, do not fail

      - name: Import EKS Cluster
        working-directory: infra-aws/inital
        run: |
          terraform import \
            'module.eks.aws_eks_cluster.this[0]' \
            ibts-eks \
            && echo "✅ EKS cluster imported" \
            || echo "⏭️  SKIP: not found or already in state"

      - name: Import VPC
        working-directory: infra-aws/inital
        run: |
          VPC_ID=$(aws ec2 describe-vpcs \
            --region ap-south-1 \
            --filters "Name=tag:Name,Values=ibts-eks-vpc" \
            --query "Vpcs[0].VpcId" \
            --output text)
          echo "VPC_ID=$VPC_ID"
          [ "$VPC_ID" = "None" ] && echo "⏭️  SKIP: VPC not found" && exit 0
          terraform import aws_vpc.ibts $VPC_ID \
            && echo "✅ VPC imported" \
            || echo "⏭️  SKIP: already in state"

      - name: Import Internet Gateway
        working-directory: infra-aws/inital
        run: |
          VPC_ID=$(aws ec2 describe-vpcs \
            --region ap-south-1 \
            --filters "Name=tag:Name,Values=ibts-eks-vpc" \
            --query "Vpcs[0].VpcId" \
            --output text)
          IGW_ID=$(aws ec2 describe-internet-gateways \
            --region ap-south-1 \
            --filters "Name=attachment.vpc-id,Values=$VPC_ID" \
            --query "InternetGateways[0].InternetGatewayId" \
            --output text)
          echo "IGW_ID=$IGW_ID"
          [ "$IGW_ID" = "None" ] && echo "⏭️  SKIP: IGW not found" && exit 0
          terraform import aws_internet_gateway.ibts $IGW_ID \
            && echo "✅ IGW imported" \
            || echo "⏭️  SKIP: already in state"

      - name: Import Private Subnet
        working-directory: infra-aws/inital
        run: |
          SUBNET_ID=$(aws ec2 describe-subnets \
            --region ap-south-1 \
            --filters "Name=tag:Name,Values=ibts-eks-private-ap-south-1a" \
            --query "Subnets[0].SubnetId" \
            --output text)
          echo "SUBNET_ID=$SUBNET_ID"
          [ "$SUBNET_ID" = "None" ] && echo "⏭️  SKIP: subnet not found" && exit 0
          terraform import 'aws_subnet.private[0]' $SUBNET_ID \
            && echo "✅ Private subnet imported" \
            || echo "⏭️  SKIP: already in state"

      - name: Import Public Subnet
        working-directory: infra-aws/inital
        run: |
          SUBNET_ID=$(aws ec2 describe-subnets \
            --region ap-south-1 \
            --filters "Name=tag:Name,Values=ibts-eks-public-ap-south-1a" \
            --query "Subnets[0].SubnetId" \
            --output text)
          echo "SUBNET_ID=$SUBNET_ID"
          [ "$SUBNET_ID" = "None" ] && echo "⏭️  SKIP: subnet not found" && exit 0
          terraform import 'aws_subnet.public[0]' $SUBNET_ID \
            && echo "✅ Public subnet imported" \
            || echo "⏭️  SKIP: already in state"

      - name: Import ALB Security Group
        working-directory: infra-aws/inital
        run: |
          SG_ID=$(aws ec2 describe-security-groups \
            --region ap-south-1 \
            --filters "Name=tag:Name,Values=ibts-eks-alb-sg" \
            --query "SecurityGroups[0].GroupId" \
            --output text)
          echo "SG_ID=$SG_ID"
          [ "$SG_ID" = "None" ] && echo "⏭️  SKIP: SG not found" && exit 0
          terraform import aws_security_group.alb $SG_ID \
            && echo "✅ ALB SG imported" \
            || echo "⏭️  SKIP: already in state"

      # ── REFRESH ────────────────────────────────────────────────────────
      # After all imports, refresh pulls REAL attribute values from AWS
      # This corrects the cluster version drift in state (1.31 → 1.30)
      - name: Terraform Refresh
        run: terraform refresh
        working-directory: infra-aws/inital

      # ── VERIFY ─────────────────────────────────────────────────────────
      # Plan must show:
      #   ✅ EKS cluster     → no changes
      #   ✅ VPC             → no changes
      #   ✅ Everything else → will be created (node group, Karpenter etc.)
      - name: Terraform Plan (Verify Clean State)
        run: terraform plan
        working-directory: infra-aws/inital
