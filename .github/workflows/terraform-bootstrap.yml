# filename: .github/workflows/terraform-bootstrap.yml
# Code Generated by Sidekick is for learning and experimentation purposes only.

name: "Terraform Bootstrap (Manual One-Time Fix)"

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  # ════════════════════════════════════════
  # STAGE 1 IMPORTS
  # ════════════════════════════════════════
  import-stage1:
    name: "Import Existing Resources Into Stage1 State"
    runs-on: ubuntu-latest
    env:
      AWS_REGION: "ap-south-2"
      CLUSTER_NAME: "ibts-eks"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Authenticate with AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: "arn:aws:iam::149614785419:role/github-actions-terraform-role"
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: "TerraformBootstrapStage1"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init
        working-directory: infra-aws/inital/stage1-cluster

      - name: Remove Stale Access Entry Keys From State
        working-directory: infra-aws/inital/stage1-cluster
        run: |
          terraform state rm \
            'module.eks.aws_eks_access_entry.this["github_actions"]' \
            2>/dev/null && echo "✅ removed github_actions key" \
            || echo "⏭️  github_actions key not in state"

          terraform state rm \
            'module.eks.aws_eks_access_policy_association.this["github_actions_admin"]' \
            2>/dev/null && echo "✅ removed github_actions_admin association" \
            || echo "⏭️  association not in state"

      - name: Import EKS Access Entry - cluster_creator
        working-directory: infra-aws/inital/stage1-cluster
        run: |
          terraform import \
            'module.eks.aws_eks_access_entry.this["cluster_creator"]' \
            'ibts-eks:arn:aws:iam::149614785419:role/github-actions-terraform-role' \
            && echo "✅ done" || echo "⏭️  already in state"

      - name: Show Stage1 State List
        working-directory: infra-aws/inital/stage1-cluster
        run: |
          echo "══════════════════════════════════════"
          echo "STAGE1 STATE AFTER IMPORTS:"
          terraform state list
          echo "══════════════════════════════════════"

  # ════════════════════════════════════════
  # STAGE 2 IMPORTS
  # ════════════════════════════════════════
  import-stage2:
    name: "Import Existing Resources Into Stage2 State"
    needs: import-stage1
    runs-on: ubuntu-latest
    env:
      AWS_REGION: "ap-south-2"
      ACCOUNT_ID: "149614785419"
      CLUSTER_NAME: "ibts-eks"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Authenticate with AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: "arn:aws:iam::149614785419:role/github-actions-terraform-role"
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: "TerraformBootstrapStage2"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init
        working-directory: infra-aws/inital/stage2-config

      # ── IAM Policies
      - name: Import IAM Policy - payment-switch
        working-directory: infra-aws/inital/stage2-config
        run: |
          terraform import \
            aws_iam_policy.payment_switch \
            arn:aws:iam::149614785419:policy/ibts-eks-payment-switch-policy \
            && echo "✅ done" || echo "⏭️  already in state"

      - name: Import IAM Policy - payment-router
        working-directory: infra-aws/inital/stage2-config
        run: |
          terraform import \
            aws_iam_policy.payment_router \
            arn:aws:iam::149614785419:policy/ibts-eks-payment-router-policy \
            && echo "✅ done" || echo "⏭️  already in state"

      - name: Import IAM Policy - idempotency-guard
        working-directory: infra-aws/inital/stage2-config
        run: |
          terraform import \
            aws_iam_policy.idempotency_guard \
            arn:aws:iam::149614785419:policy/ibts-eks-idempotency-guard-policy \
            && echo "✅ done" || echo "⏭️  already in state"

      # ── IRSA Roles (app services)
      - name: Import IRSA Role - payment-switch
        working-directory: infra-aws/inital/stage2-config
        run: |
          terraform import \
            'module.irsa_payment_switch.aws_iam_role.this[0]' \
            ibts-eks-payment-switch \
            && echo "✅ done" || echo "⏭️  already in state"

      - name: Import IRSA Role - payment-router
        working-directory: infra-aws/inital/stage2-config
        run: |
          terraform import \
            'module.irsa_payment_router.aws_iam_role.this[0]' \
            ibts-eks-payment-router \
            && echo "✅ done" || echo "⏭️  already in state"

      - name: Import IRSA Role - idempotency-guard
        working-directory: infra-aws/inital/stage2-config
        run: |
          terraform import \
            'module.irsa_idempotency_guard.aws_iam_role.this[0]' \
            ibts-eks-idempotency-guard \
            && echo "✅ done" || echo "⏭️  already in state"

      # ── Karpenter IRSA role
      # ✅ ADDED: was failing with EntityAlreadyExists in main pipeline
      - name: Import IRSA Role - karpenter-controller
        working-directory: infra-aws/inital/stage2-config
        run: |
          terraform import \
            'module.karpenter_irsa.aws_iam_role.this[0]' \
            ibts-eks-karpenter-controller \
            && echo "✅ done" || echo "⏭️  already in state"

      # ── Karpenter node IAM role
      # ✅ ADDED: created by previous failed run, not in state
      - name: Import IAM Role - karpenter-node
        working-directory: infra-aws/inital/stage2-config
        run: |
          terraform import \
            aws_iam_role.karpenter_node \
            ibts-eks-karpenter-node \
            && echo "✅ done" || echo "⏭️  already in state"

      # ── Karpenter node instance profile
      # ✅ ADDED: created alongside node role, must import separately
      - name: Import IAM Instance Profile - karpenter-node
        working-directory: infra-aws/inital/stage2-config
        run: |
          terraform import \
            aws_iam_instance_profile.karpenter_node \
            ibts-eks-karpenter-node \
            && echo "✅ done" || echo "⏭️  already in state"

      # ── Karpenter SQS queue
      # ✅ FIXED: queue name is ibts-eks-karpenter NOT ibts-eks-karpenter-interruption
      # Confirmed from pipeline log:
      #   aws_sqs_queue_policy.karpenter_interruption: Creation complete
      #   [id=https://sqs.ap-south-2.amazonaws.com/149614785419/ibts-eks-karpenter]
      - name: Import SQS Queue - karpenter
        working-directory: infra-aws/inital/stage2-config
        run: |
          terraform import \
            aws_sqs_queue.karpenter_interruption \
            https://sqs.ap-south-2.amazonaws.com/149614785419/ibts-eks-karpenter \
            && echo "✅ done" || echo "⏭️  already in state"

      - name: Import SQS Queue Policy - karpenter
        working-directory: infra-aws/inital/stage2-config
        run: |
          terraform import \
            aws_sqs_queue_policy.karpenter_interruption \
            https://sqs.ap-south-2.amazonaws.com/149614785419/ibts-eks-karpenter \
            && echo "✅ done" || echo "⏭️  already in state"

      # ── EventBridge rules
      # ✅ ADDED: created by previous runs, may not be in state
      - name: Import EventBridge Rule - karpenter-spot
        working-directory: infra-aws/inital/stage2-config
        run: |
          terraform import \
            aws_cloudwatch_event_rule.karpenter_interruption_spot \
            ibts-eks-karpenter-spot \
            && echo "✅ done" || echo "⏭️  already in state"

      - name: Import EventBridge Rule - karpenter-rebalance
        working-directory: infra-aws/inital/stage2-config
        run: |
          terraform import \
            aws_cloudwatch_event_rule.karpenter_rebalance \
            ibts-eks-karpenter-rebalance \
            && echo "✅ done" || echo "⏭️  already in state"

      - name: Import EventBridge Rule - karpenter-instance-state
        working-directory: infra-aws/inital/stage2-config
        run: |
          terraform import \
            aws_cloudwatch_event_rule.karpenter_instance_state \
            ibts-eks-karpenter-instance-state \
            && echo "✅ done" || echo "⏭️  already in state"

      - name: Show Stage2 State List
        working-directory: infra-aws/inital/stage2-config
        run: |
          echo "══════════════════════════════════════"
          echo "STAGE2 STATE AFTER IMPORTS:"
          terraform state list
          echo "══════════════════════════════════════"
