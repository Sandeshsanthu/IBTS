# filename: .github/workflows/terraform-bootstrap.yml
# Code Generated by Sidekick is for learning and experimentation purposes only.

name: "Terraform Bootstrap (Manual One-Time Fix)"

on:
  workflow_dispatch:

env:
  ACTIONS_STEP_DEBUG: true

permissions:
  id-token: write
  contents: read

jobs:
  bootstrap:
    name: "Import + Refresh Existing Resources"
    runs-on: ubuntu-latest
    env:
      AWS_REGION: "ap-south-1"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Authenticate with AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: "arn:aws:iam::149614785419:role/github-actions-terraform-role"
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: "GitHubActionsTerraformBootstrap"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init
        working-directory: infra-aws/inital

      # ── ROUND 1: Infrastructure resources ─────────────────────────────

      - name: Import EKS Cluster
        working-directory: infra-aws/inital
        run: |
          terraform import \
            'module.eks.aws_eks_cluster.this[0]' ibts-eks \
            && echo "✅ imported" || echo "⏭️  SKIP"

      - name: Import VPC
        working-directory: infra-aws/inital
        run: |
          VPC_ID=$(aws ec2 describe-vpcs \
            --region ap-south-1 \
            --filters "Name=tag:Name,Values=ibts-eks-vpc" \
            --query "Vpcs[0].VpcId" --output text)
          echo "VPC_ID=$VPC_ID"
          [ "$VPC_ID" = "None" ] && echo "⏭️  SKIP" && exit 0
          terraform import aws_vpc.ibts $VPC_ID \
            && echo "✅ imported" || echo "⏭️  SKIP"

      - name: Import Internet Gateway
        working-directory: infra-aws/inital
        run: |
          VPC_ID=$(aws ec2 describe-vpcs \
            --region ap-south-1 \
            --filters "Name=tag:Name,Values=ibts-eks-vpc" \
            --query "Vpcs[0].VpcId" --output text)
          IGW_ID=$(aws ec2 describe-internet-gateways \
            --region ap-south-1 \
            --filters "Name=attachment.vpc-id,Values=$VPC_ID" \
            --query "InternetGateways[0].InternetGatewayId" --output text)
          echo "IGW_ID=$IGW_ID"
          [ "$IGW_ID" = "None" ] && echo "⏭️  SKIP" && exit 0
          terraform import aws_internet_gateway.ibts $IGW_ID \
            && echo "✅ imported" || echo "⏭️  SKIP"

      - name: Import Private Subnet
        working-directory: infra-aws/inital
        run: |
          SUBNET_ID=$(aws ec2 describe-subnets \
            --region ap-south-1 \
            --filters "Name=tag:Name,Values=ibts-eks-private-ap-south-1a" \
            --query "Subnets[0].SubnetId" --output text)
          echo "SUBNET_ID=$SUBNET_ID"
          [ "$SUBNET_ID" = "None" ] && echo "⏭️  SKIP" && exit 0
          terraform import 'aws_subnet.private[0]' $SUBNET_ID \
            && echo "✅ imported" || echo "⏭️  SKIP"

      - name: Import Public Subnet
        working-directory: infra-aws/inital
        run: |
          SUBNET_ID=$(aws ec2 describe-subnets \
            --region ap-south-1 \
            --filters "Name=tag:Name,Values=ibts-eks-public-ap-south-1a" \
            --query "Subnets[0].SubnetId" --output text)
          echo "SUBNET_ID=$SUBNET_ID"
          [ "$SUBNET_ID" = "None" ] && echo "⏭️  SKIP" && exit 0
          terraform import 'aws_subnet.public[0]' $SUBNET_ID \
            && echo "✅ imported" || echo "⏭️  SKIP"

      - name: Import ALB Security Group
        working-directory: infra-aws/inital
        run: |
          SG_ID=$(aws ec2 describe-security-groups \
            --region ap-south-1 \
            --filters "Name=tag:Name,Values=ibts-eks-alb-sg" \
            --query "SecurityGroups[0].GroupId" --output text)
          echo "SG_ID=$SG_ID"
          [ "$SG_ID" = "None" ] && echo "⏭️  SKIP" && exit 0
          terraform import aws_security_group.alb $SG_ID \
            && echo "✅ imported" || echo "⏭️  SKIP"

      # ── ROUND 2: IAM Policies + KMS + CloudWatch ───────────────────────
      # These were created by a previous partial apply run
      # ARNs are deterministic — no lookup needed

      - name: Import IAM Policy - payment-switch
        working-directory: infra-aws/inital
        run: |
          terraform import \
            aws_iam_policy.payment_switch \
            arn:aws:iam::149614785419:policy/ibts-eks-payment-switch-policy \
            && echo "✅ imported" || echo "⏭️  SKIP"

      - name: Import IAM Policy - payment-router
        working-directory: infra-aws/inital
        run: |
          terraform import \
            aws_iam_policy.payment_router \
            arn:aws:iam::149614785419:policy/ibts-eks-payment-router-policy \
            && echo "✅ imported" || echo "⏭️  SKIP"

      - name: Import IAM Policy - idempotency-guard
        working-directory: infra-aws/inital
        run: |
          terraform import \
            aws_iam_policy.idempotency_guard \
            arn:aws:iam::149614785419:policy/ibts-eks-idempotency-guard-policy \
            && echo "✅ imported" || echo "⏭️  SKIP"

      - name: Import KMS Alias
        working-directory: infra-aws/inital
        run: |
          terraform import \
            'module.eks.module.kms.aws_kms_alias.this["cluster"]' \
            alias/eks/ibts-eks \
            && echo "✅ imported" || echo "⏭️  SKIP"

      - name: Import CloudWatch Log Group
        working-directory: infra-aws/inital
        run: |
          terraform import \
            'module.eks.aws_cloudwatch_log_group.this[0]' \
            /aws/eks/ibts-eks/cluster \
            && echo "✅ imported" || echo "⏭️  SKIP"

      # ── REFRESH + VERIFY ───────────────────────────────────────────────

      - name: Terraform Refresh
        run: terraform refresh
        working-directory: infra-aws/inital

      - name: Terraform Plan (Verify Clean State)
        run: terraform plan
        working-directory: infra-aws/inital
