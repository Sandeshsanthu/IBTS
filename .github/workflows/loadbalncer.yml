# Code Generated by Sidekick is for learning and experimentation purposes only.
# filename: .github/workflows/terraform-lb.yml

name: "IBTS Load Balancer"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm running this load balancer deployment'
        required: true
        type: string
        default: "no"
      action:
        description: "apply creates/updates the ALB, destroy removes it"
        required: true
        type: choice
        options:
          - apply
          - destroy
        default: apply

# Queue runs instead of cancelling: cancelling a Terraform apply mid-flight is risky.
concurrency:
  group: ibts-stage3-lb
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "ap-south-2"
  CLUSTER_NAME: "ibts-eks"
  TF_VAR_aws_region: "ap-south-2"
  TF_VAR_cluster_name: "ibts-eks"
  TF_CLI_ARGS_plan: "-lock-timeout=3m"
  TF_CLI_ARGS_apply: "-lock-timeout=3m"
  TF_DIR: infra-aws/inital/stage3-lb

jobs:
  # =========================================
  # STAGE 3 PLAN
  # =========================================
  stage3-plan:
    name: "Stage 3 Plan (Load Balancer)"
    if: inputs.confirm == 'yes'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::149614785419:role/github-actions-terraform-role"
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: "Stage3Plan"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"

      # Fail early with a clear message instead of a confusing Terraform error.
      - name: Preflight checks
        if: inputs.action == 'apply'
        run: |
          echo "Checking TargetGroupBinding CRD (installed by the AWS Load Balancer Controller)..."
          kubectl get crd targetgroupbindings.elbv2.k8s.aws
          echo "Checking api-gateway Service and ready endpoints..."
          kubectl -n ibts-app get svc api-gateway
          kubectl -n ibts-app get endpoints api-gateway -o jsonpath='{.subsets[*].addresses[*].ip}' | grep -q . \
            || { echo "::error::api-gateway has no ready endpoints. Deploy the app first."; exit 1; }

      - name: Init
        run: terraform init -input=false
        working-directory: ${{ env.TF_DIR }}

      - name: Format check
        run: terraform fmt -check
        working-directory: ${{ env.TF_DIR }}

      - name: Validate
        run: terraform validate
        working-directory: ${{ env.TF_DIR }}

      - name: Plan
        env:
          ACTION: ${{ inputs.action }}
        working-directory: ${{ env.TF_DIR }}
        run: |
          if [ "$ACTION" = "destroy" ]; then
            terraform plan -destroy -refresh=true -input=false -out=tfplan-stage3
          else
            terraform plan -refresh=true -input=false -out=tfplan-stage3
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-stage3
          path: ${{ env.TF_DIR }}/tfplan-stage3
          retention-days: 1

  # =========================================
  # STAGE 3 APPLY
  # =========================================
  stage3-apply:
    name: "Stage 3 Apply (Load Balancer)"
    needs: stage3-plan
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::149614785419:role/github-actions-terraform-role"
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: "Stage3Apply"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"

      - name: Init
        run: terraform init -input=false
        working-directory: ${{ env.TF_DIR }}

      - uses: actions/download-artifact@v4
        with:
          name: tfplan-stage3
          path: ${{ env.TF_DIR }}

      - name: Apply
        run: terraform apply -input=false tfplan-stage3
        working-directory: ${{ env.TF_DIR }}

      # ---- Verification (skipped on destroy) ----
      - name: Wait for healthy targets
        if: inputs.action == 'apply'
        working-directory: ${{ env.TF_DIR }}
        run: |
          TG_ARN=$(terraform output -raw target_group_arn)
          HEALTHY=false
          for i in $(seq 1 24); do
            STATES=$(aws elbv2 describe-target-health \
              --target-group-arn "$TG_ARN" \
              --query 'TargetHealthDescriptions[].TargetHealth.State' --output text)
            echo "Attempt $i/24: targets=[${STATES:-none registered}]"
            if [ -n "$STATES" ] && [ -z "$(echo "$STATES" | tr '\t' '\n' | grep -vx healthy)" ]; then
              HEALTHY=true
              break
            fi
            sleep 20
          done
          if [ "$HEALTHY" != "true" ]; then
            echo "::error::Targets did not become healthy within 8 minutes"
            exit 1
          fi

      - name: Smoke test through the ALB
        if: inputs.action == 'apply'
        working-directory: ${{ env.TF_DIR }}
        run: |
          ALB=$(terraform output -raw alb_dns_name)
          echo "Testing http://$ALB/actuator/health"
          curl -fsS --retry 10 --retry-delay 15 --retry-all-errors \
            "http://$ALB/actuator/health"

      # ---- Diagnostics (only when something above failed) ----
      - name: Dump diagnostics on failure
        if: failure() && inputs.action == 'apply'
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "--- TargetGroupBindings ---"
          kubectl -n ibts-app get targetgroupbindings || true
          kubectl -n ibts-app describe targetgroupbinding api-gateway-tgb || true
          echo "--- Controller logs ---"
          kubectl -n kube-system logs deploy/aws-load-balancer-controller --tail=60 || true
          echo "--- Target health ---"
          aws elbv2 describe-target-health \
            --target-group-arn "$(terraform output -raw target_group_arn)" || true
