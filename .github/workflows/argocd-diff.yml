# filename: .github/workflows/argocd-diff.yml

name: "IBTS ArgoCD Diff (read-only)"

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "ap-south-2"
  CLUSTER_NAME: "ibts-eks"

jobs:
  diff:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::149614785419:role/github-actions-terraform-role"
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: "ArgoDiff"

      - name: Connect to EKS
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"

      - name: Force Argo CD to re-compare with Git
        run: |
          kubectl -n argocd annotate application ibts-app argocd.argoproj.io/refresh=hard --overwrite
          sleep 30

      - name: Application status and last sync result
        run: |
          kubectl -n argocd get application ibts-app
          echo "--- last operation ---"
          kubectl -n argocd get application ibts-app \
            -o jsonpath='{.status.operationState.phase}: {.status.operationState.message}{"\n"}'
          echo "--- resources not Synced ---"
          kubectl -n argocd get application ibts-app \
            -o jsonpath='{range .status.resources[?(@.status!="Synced")]}{.kind}/{.name}: {.status}{"\n"}{end}'

      - name: Real diff - Git (Kustomize output) vs live cluster
        run: |
          kubectl kustomize .k8s/overlays/production --load-restrictor LoadRestrictionsNone \
            | kubectl diff -f - || true

      - name: Images and replicas currently running
        run: |
          kubectl -n ibts-app get deploy \
            -o custom-columns=NAME:.metadata.name,REPLICAS:.spec.replicas,IMAGE:.spec.template.spec.containers[*].image

