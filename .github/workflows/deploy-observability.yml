# Code Generated by Sidekick is for learning and experimentation purposes only.
# filename: .github/workflows/deploy-observability.yml
name: Deploy Observability

on:
  workflow_dispatch:   # manual trigger
  # Optional: auto-run after the infra pipeline succeeds on main.
  # Replace "Infra" with the exact `name:` of your existing workflow.
  # workflow_run:
  #   workflows: ["Infra"]
  #   types: [completed]
  #   branches: [main]

env:
  AWS_REGION: us-east-1   # set to your region
  OBS_NAMESPACE: ibts-observability

permissions:
  id-token: write
  contents: read

# Prevents two helm runs from fighting over the same releases
concurrency:
  group: observability-deploy
  cancel-in-progress: false

jobs:
  observability:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Needed only if you enable the workflow_run trigger above
    # if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve EKS cluster name
        id: cluster
        run: |
          NAME=$(aws eks list-clusters --region "$AWS_REGION" \
            --query 'clusters[0]' --output text)
          if [[ -z "$NAME" || "$NAME" == "None" ]]; then
            echo "No EKS cluster found in $AWS_REGION"
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "${{ steps.cluster.outputs.name }}"
          kubectl get nodes

      - name: Verify Karpenter prerequisites
        run: |
          kubectl get nodepool default
          kubectl get storageclass gp3

      - name: Deploy metrics, logging and tracing
        env:
          TF_VAR_grafana_admin_password: ${{ secrets.TF_VAR_GRAFANA_ADMIN_PASSWORD }}
        run: |
          chmod +x scripts/deploy-logging-tracing.sh
          ./scripts/deploy-logging-tracing.sh

      - name: Dump state on failure
        if: failure()
        run: |
          kubectl get pods,pvc -n "$OBS_NAMESPACE" -o wide || true
          kubectl get events -n "$OBS_NAMESPACE" --sort-by='.lastTimestamp' | tail -40 || true
          helm list -n "$OBS_NAMESPACE" -a || true
