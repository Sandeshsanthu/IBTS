# filename: .github/workflows/terraform.yml
# Code Generated by Sidekick is for learning and experimentation purposes only.

name: "Terraform CI/CD Pipeline (Keyless OIDC)"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: terraform-environment
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  # ════════════════════════════════════════
  # STAGE 1 PLAN — VPC + EKS cluster only
  # ════════════════════════════════════════
  stage1-plan:
    name: "Stage 1 Plan (Cluster)"
    runs-on: ubuntu-latest
    env:
      AWS_REGION: "ap-south-2"

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::149614785419:role/github-actions-terraform-role"
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: "TerraformStage1Plan"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Init
        run: terraform init
        working-directory: infra-aws/inital/stage1-cluster

      - name: Plan
        run: terraform plan -refresh=true -out=tfplan-stage1
        working-directory: infra-aws/inital/stage1-cluster

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-stage1
          path: infra-aws/inital/stage1-cluster/tfplan-stage1
          retention-days: 1

  # ════════════════════════════════════════
  # STAGE 1 APPLY — creates cluster
  # ════════════════════════════════════════
  stage1-apply:
    name: "Stage 1 Apply (Cluster)"
    needs: stage1-plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: "ap-south-2"

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::149614785419:role/github-actions-terraform-role"
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: "TerraformStage1Apply"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Init
        run: terraform init
        working-directory: infra-aws/inital/stage1-cluster

      - uses: actions/download-artifact@v4
        with:
          name: tfplan-stage1
          path: infra-aws/inital/stage1-cluster

      - name: Apply
        run: terraform apply -input=false tfplan-stage1
        working-directory: infra-aws/inital/stage1-cluster

  # ════════════════════════════════════════
  # STAGE 2 PLAN
  # ════════════════════════════════════════
  stage2-plan:
    name: "Stage 2 Plan (K8s Config)"
    needs: stage1-apply
    runs-on: ubuntu-latest
    env:
      AWS_REGION: "ap-south-2"

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::149614785419:role/github-actions-terraform-role"
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: "TerraformStage2Plan"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Init
        run: terraform init
        working-directory: infra-aws/inital/stage2-config

      - name: Plan
        env:
          TF_VAR_jwt_secret:             ${{ secrets.TF_VAR_JWT_SECRET }}
          TF_VAR_api_key:                ${{ secrets.TF_VAR_API_KEY }}
          TF_VAR_grafana_admin_password: ${{ secrets.TF_VAR_GRAFANA_ADMIN_PASSWORD }}
        run: terraform plan -refresh=true -out=tfplan-stage2
        working-directory: infra-aws/inital/stage2-config

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-stage2
          path: infra-aws/inital/stage2-config/tfplan-stage2
          retention-days: 1

  # ════════════════════════════════════════
  # STAGE 2 APPLY
  # ════════════════════════════════════════
  stage2-apply:
    name: "Stage 2 Apply (K8s Config)"
    needs: stage2-plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: "ap-south-2"

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::149614785419:role/github-actions-terraform-role"
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: "TerraformStage2Apply"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      # ✅ ADDED: configure kubectl so helm commands work in pipeline
      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name $(terraform -chdir=infra-aws/inital/stage2-config output -raw cluster_name 2>/dev/null || \
                     aws eks list-clusters --region ${{ env.AWS_REGION }} \
                       --query 'clusters[0]' --output text)

      # ✅ ADDED: clean up failed Helm releases before apply
      # --ignore-not-found → safe to run even on first deploy
      # only uninstalls releases that are in failed/pending state
      # healthy releases are left untouched by helm uninstall
      - name: Cleanup failed Helm releases
        run: |
          # Install helm (already available on ubuntu-latest)
          # Uninstall only if release exists in failed state
          for release in kube-prometheus-stack elasticsearch otel-collector kibana jaeger fluent-bit; do
            STATUS=$(helm status $release -n ibts-observability --output json 2>/dev/null \
                       | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['status'])" \
                       2>/dev/null || echo "not-found")

            if [[ "$STATUS" == "failed" || "$STATUS" == "pending-install" || "$STATUS" == "pending-upgrade" ]]; then
              echo "Uninstalling failed release: $release (status: $STATUS)"
              helm uninstall $release -n ibts-observability
            else
              echo "Release $release status: $STATUS — skipping"
            fi
          done

      - name: Init
        run: terraform init
        working-directory: infra-aws/inital/stage2-config

      - uses: actions/download-artifact@v4
        with:
          name: tfplan-stage2
          path: infra-aws/inital/stage2-config

      - name: Apply
        env:
          TF_VAR_jwt_secret:             ${{ secrets.TF_VAR_JWT_SECRET }}
          TF_VAR_api_key:                ${{ secrets.TF_VAR_API_KEY }}
          TF_VAR_grafana_admin_password: ${{ secrets.TF_VAR_GRAFANA_ADMIN_PASSWORD }}
        run: terraform apply -input=false tfplan-stage2
        working-directory: infra-aws/inital/stage2-config
