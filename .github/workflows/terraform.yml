# filename: .github/workflows/terraform.yml
name: "IBTS Infrastructure"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "ap-south-2"
  CLUSTER_NAME: "ibts-eks"

jobs:
  # =========================================
  # STAGE 1 PLAN
  # =========================================
  stage1-plan:
    name: "Stage 1 Plan (Cluster)"
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::149614785419:role/github-actions-terraform-role"
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: "Stage1Plan"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Init
        run: terraform init
        working-directory: infra-aws/stage1-config

      - name: Validate
        run: terraform validate
        working-directory: infra-aws/stage1-config

      - name: Plan
        run: terraform plan -refresh=true -out=tfplan-stage1
        working-directory: infra-aws/stage1-config

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-stage1
          path: infra-aws/stage1-config/tfplan-stage1
          retention-days: 1

  # =========================================
  # STAGE 1 APPLY
  # =========================================
  stage1-apply:
    name: "Stage 1 Apply (Cluster)"
    needs: stage1-plan
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::149614785419:role/github-actions-terraform-role"
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: "Stage1Apply"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Init
        run: terraform init
        working-directory: infra-aws/stage1-config

      - uses: actions/download-artifact@v4
        with:
          name: tfplan-stage1
          path: infra-aws/stage1-config

      - name: Apply
        run: terraform apply -input=false tfplan-stage1
        working-directory: infra-aws/stage1-config

  # =========================================
  # STAGE 2 PLAN
  # =========================================
  stage2-plan:
    name: "Stage 2 Plan (Addons)"
    needs: stage1-apply
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::149614785419:role/github-actions-terraform-role"
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: "Stage2Plan"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Init
        run: terraform init
        working-directory: infra-aws/inital/stage2-config

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name $(aws eks list-clusters \
                       --region ${{ env.AWS_REGION }} \
                       --query 'clusters[0]' \
                       --output text)

      - name: Validate
        run: terraform validate
        working-directory: infra-aws/inital/stage2-config

      - name: Plan
        run: terraform plan -refresh=true -out=tfplan-stage2
        working-directory: infra-aws/inital/stage2-config
        env:
          TF_VAR_grafana_admin_password: ${{ secrets.TF_VAR_GRAFANA_ADMIN_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-stage2
          path: infra-aws/inital/stage2-config/tfplan-stage2
          retention-days: 1

  # =========================================
  # STAGE 2 APPLY
  # =========================================
  stage2-apply:
    name: "Stage 2 Apply (Addons)"
    needs: stage2-plan
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::149614785419:role/github-actions-terraform-role"
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: "Stage2Apply"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Init
        run: terraform init
        working-directory: infra-aws/inital/stage2-config

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name $(aws eks list-clusters \
                       --region ${{ env.AWS_REGION }} \
                       --query 'clusters[0]' \
                       --output text)

      - name: Cleanup failed Karpenter release
        run: |
          STATUS=$(helm status karpenter -n kube-system --output json 2>/dev/null \
                     | python3 -c "import sys,json; \
                         print(json.load(sys.stdin)['info']['status'])" \
                     2>/dev/null || echo "not-found")

          if [[ "$STATUS" == "failed" || \
                "$STATUS" == "pending-install" || \
                "$STATUS" == "pending-upgrade" ]]; then
            echo "Uninstalling karpenter (status: $STATUS)"
            helm uninstall karpenter -n kube-system --ignore-not-found
          else
            echo "Karpenter status: $STATUS -- skipping"
          fi

      - uses: actions/download-artifact@v4
        with:
          name: tfplan-stage2
          path: infra-aws/inital/stage2-config

      - name: Apply
        env:
          TF_VAR_grafana_admin_password: ${{ secrets.TF_VAR_GRAFANA_ADMIN_PASSWORD }}
        run: terraform apply -input=false tfplan-stage2
        working-directory: infra-aws/inital/stage2-config

  # =========================================
  # OBSERVABILITY DEPLOY
  # =========================================
  deploy-observability:
    name: "Deploy Observability Stack"
    needs: stage2-apply
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: "ap-south-2"

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::149614785419:role/github-actions-terraform-role"
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: "DeployObservability"

      - name: Deploy observability stack
        env:
          TF_VAR_grafana_admin_password: ${{ secrets.TF_VAR_GRAFANA_ADMIN_PASSWORD }}
        run: |
          chmod +x scripts/deploy-observability.sh
          ./scripts/deploy-observability.sh \
            $(aws eks list-clusters \
                --region ${{ env.AWS_REGION }} \
                --query 'clusters[0]' \
                --output text) \
            ${{ env.AWS_REGION }}
