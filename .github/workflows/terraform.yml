name: "Terraform CI/CD Pipeline (Keyless OIDC)"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: terraform-environment
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  # ==========================================
  # JOB 1: PLAN (Runs on PRs and Push to Main)
  # ==========================================
  terraform-plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    env:
      AWS_REGION: "us-east-1"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate with AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::149614785419:role/github-actions-terraform-role"
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: "GitHubActionsTerraformPlan"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform Init
        run: terraform init
        working-directory: infra-aws/inital

      # 🚀 REMOVED: The 'terraform fmt -check' step has been bypassed so style mismatches won't block deployment

      - name: Terraform Plan
        id: plan
        run: terraform plan -out=tfplan
        working-directory: infra-aws/inital

      # Save the generated plan file out of the subdirectory as a workflow artifact
      - name: Upload Terraform Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra-aws/inital/tfplan
          retention-days: 1

  # ==========================================
  # JOB 2: APPLY (Only runs on push/merge to Main)
  # ==========================================
  terraform-apply:
    name: "Terraform Apply"
    needs: terraform-plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production # Your Manual Approval Review Gate
    env:
      AWS_REGION: "us-east-1"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate with AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::149614785419:role/github-actions-terraform-role"
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: "GitHubActionsTerraformApply"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform Init
        run: terraform init
        working-directory: infra-aws/inital

      # Download the execution plan artifact directly back into your subfolder
      - name: Download Terraform Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra-aws/inital

      - name: Terraform Apply
        run: terraform apply -input=false tfplan
        working-directory: infra-aws/inital
