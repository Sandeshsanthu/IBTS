# filename: .github/workflows/terraform.yml
# Code Generated by Sidekick is for learning and experimentation purposes only.

name: "Terraform CI/CD Pipeline (Keyless OIDC)"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: terraform-environment
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  # ==========================================
  # JOB 1: PLAN (Runs on PRs and Push to Main)
  # ==========================================
  terraform-plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    env:
      AWS_REGION: "ap-south-1"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate with AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::149614785419:role/github-actions-terraform-role"
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: "GitHubActionsTerraformPlan"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init
        working-directory: infra-aws/inital

      # ✅ ADDED: Syncs real AWS state into S3 before plan reads it
      # This ensures plan sees imported resources (EKS cluster, IAM policies etc.)
      # and does NOT try to recreate them
      # Safe to run always — if nothing exists yet it is a no-op
      - name: Terraform Refresh
        run: terraform refresh
        working-directory: infra-aws/inital

      - name: Terraform Plan
        id: plan
        run: terraform plan -out=tfplan
        working-directory: infra-aws/inital

      - name: Upload Terraform Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra-aws/inital/tfplan
          retention-days: 1

  # ==========================================
  # JOB 2: APPLY (Only runs on push/merge to Main)
  # ==========================================
  terraform-apply:
    name: "Terraform Apply"
    needs: terraform-plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production

    env:
      AWS_REGION: "ap-south-1"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate with AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::149614785419:role/github-actions-terraform-role"
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: "GitHubActionsTerraformApply"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init
        working-directory: infra-aws/inital

      # ✅ ADDED: Apply job runs on a brand new runner with no memory
      # Init pulls state from S3 but attributes may be stale
      # Refresh ensures apply sees the same reality as plan did
      - name: Terraform Refresh
        run: terraform refresh
        working-directory: infra-aws/inital

      - name: Download Terraform Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra-aws/inital

      - name: Terraform Apply
        run: terraform apply -input=false tfplan
        working-directory: infra-aws/inital
