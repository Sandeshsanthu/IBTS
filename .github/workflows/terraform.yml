# filename: .github/workflows/terraform.yml
name: Terraform Infrastructure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-2
  CLUSTER_NAME: ibts-eks
  TF_VERSION: 1.7.5

jobs:
  # =========================================
  # STAGE 1 - VPC, EKS cluster, base network
  # =========================================
  stage1-plan:
    name: Stage1 Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra-aws/inital/stage1-cluster
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -refresh=true -out=tfplan-stage1

      - name: Upload stage1 plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-stage1
          path: infra-aws/inital/stage1-cluster/tfplan-stage1
          retention-days: 1

  stage1-apply:
    name: Stage1 Apply
    runs-on: ubuntu-latest
    needs: stage1-plan
    defaults:
      run:
        working-directory: infra-aws/inital/stage1-cluster
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Download stage1 plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-stage1
          path: infra-aws/inital/stage1-cluster

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan-stage1

  # =========================================
  # STAGE 2 - EKS addons, Karpenter, namespaces
  # =========================================
  stage2-plan:
    name: Stage2 Plan
    runs-on: ubuntu-latest
    needs: stage1-apply
    defaults:
      run:
        working-directory: infra-aws/inital/stage2-config
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -refresh=true -out=tfplan-stage2

      - name: Upload stage2 plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-stage2
          path: infra-aws/inital/stage2-config/tfplan-stage2
          retention-days: 1

  stage2-apply:
    name: Stage2 Apply
    runs-on: ubuntu-latest
    needs: stage2-plan
    defaults:
      run:
        working-directory: infra-aws/inital/stage2-config
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

      - name: Terraform Init
        run: terraform init

      - name: Download stage2 plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-stage2
          path: infra-aws/inital/stage2-config

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan-stage2

  # =========================================
  # OBSERVABILITY - Karpenter + stack deploy
  # =========================================
  deploy-observability:
    name: Deploy Observability
    runs-on: ubuntu-latest
    needs: stage2-apply
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install tools
        run: |
          # kubectl
          curl -LO "https://dl.k8s.io/release/$(curl -Ls https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

          # helm
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

          # python3 already available on ubuntu-latest

      - name: Deploy observability stack
        env:
          TF_VAR_grafana_admin_password: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          KARPENTER_VERSION: "1.0.8"
        run: |
          chmod +x scripts/deploy-observability.sh
          ./scripts/deploy-observability.sh ${{ env.CLUSTER_NAME }} ${{ env.AWS_REGION }}
