# filename: .github/workflows/pr-checks.yml
# Code Generated by Sidekick is for learning and experimentation purposes only.

name: PR Checks

on:
  push:
    branches: [ main, develop ]      # ? fires on direct push to main/develop
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:                 # ? manual trigger from GitHub UI

concurrency:
  group: pr-checks-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      api-gateway:       ${{ steps.f.outputs.api-gateway }}
      payment-switch:    ${{ steps.f.outputs.payment-switch }}
      payment-router:    ${{ steps.f.outputs.payment-router }}
      bank-adapter:      ${{ steps.f.outputs.bank-adapter }}
      idempotency-guard: ${{ steps.f.outputs.idempotency-guard }}
      shared:            ${{ steps.f.outputs.shared }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            api-gateway:
              - 'api-gateway/**'
            payment-switch:
              - 'payment-switch/**'
            payment-router:
              - 'payment-router/**'
            bank-adapter:
              - 'bank-adapter/**'
            idempotency-guard:
              - 'idempotency-guard/**'
            shared:
              - 'shared/**'

  lint:
    name: Lint – ${{ matrix.service.name }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: api-gateway,       changed: "${{ needs.changes.outputs.api-gateway }}" }
          - { name: payment-switch,    changed: "${{ needs.changes.outputs.payment-switch }}" }
          - { name: payment-router,    changed: "${{ needs.changes.outputs.payment-router }}" }
          - { name: bank-adapter,      changed: "${{ needs.changes.outputs.bank-adapter }}" }
          - { name: idempotency-guard, changed: "${{ needs.changes.outputs.idempotency-guard }}" }

    steps:
      - uses: actions/checkout@v4
        if: matrix.service.changed == 'true' || needs.changes.outputs.shared == 'true'

      - uses: actions/setup-python@v5
        if: matrix.service.changed == 'true' || needs.changes.outputs.shared == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        if: matrix.service.changed == 'true' || needs.changes.outputs.shared == 'true'
        run: pip install ruff==0.4.4

      - name: ruff check
        if: matrix.service.changed == 'true' || needs.changes.outputs.shared == 'true'
        working-directory: ${{ matrix.service.name }}
        run: |
          ruff check app/ \
            --config ../config/ruff.toml \
            --output-format=github \
            --statistics || true

      - name: ruff format check
        if: matrix.service.changed == 'true' || needs.changes.outputs.shared == 'true'
        working-directory: ${{ matrix.service.name }}
        run: |
          ruff format app/ \
            --config ../config/ruff.toml \
            --check || true

  sast:
    name: SAST – ${{ matrix.service.name }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: api-gateway,       changed: "${{ needs.changes.outputs.api-gateway }}" }
          - { name: payment-switch,    changed: "${{ needs.changes.outputs.payment-switch }}" }
          - { name: payment-router,    changed: "${{ needs.changes.outputs.payment-router }}" }
          - { name: bank-adapter,      changed: "${{ needs.changes.outputs.bank-adapter }}" }
          - { name: idempotency-guard, changed: "${{ needs.changes.outputs.idempotency-guard }}" }

    steps:
      - uses: actions/checkout@v4
        if: matrix.service.changed == 'true' || needs.changes.outputs.shared == 'true'

      - uses: actions/setup-python@v5
        if: matrix.service.changed == 'true' || needs.changes.outputs.shared == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        if: matrix.service.changed == 'true' || needs.changes.outputs.shared == 'true'
        run: pip install bandit[toml]

      - name: Run Bandit
        if: matrix.service.changed == 'true' || needs.changes.outputs.shared == 'true'
        working-directory: ${{ matrix.service.name }}
        run: |
          bandit -r app/ \
            -ll \
            --format json \
            --output bandit-report.json || true

      - name: Upload Bandit report
        if: always() && (matrix.service.changed == 'true' || needs.changes.outputs.shared == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: bandit-${{ matrix.service.name }}
          path: ${{ matrix.service.name }}/bandit-report.json
          retention-days: 14

  unit-tests:
    name: Tests – ${{ matrix.service.name }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: api-gateway,       changed: "${{ needs.changes.outputs.api-gateway }}" }
          - { name: payment-switch,    changed: "${{ needs.changes.outputs.payment-switch }}" }
          - { name: payment-router,    changed: "${{ needs.changes.outputs.payment-router }}" }
          - { name: bank-adapter,      changed: "${{ needs.changes.outputs.bank-adapter }}" }
          - { name: idempotency-guard, changed: "${{ needs.changes.outputs.idempotency-guard }}" }

    steps:
      - uses: actions/checkout@v4
        if: matrix.service.changed == 'true' || needs.changes.outputs.shared == 'true'

      - uses: actions/setup-python@v5
        if: matrix.service.changed == 'true' || needs.changes.outputs.shared == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ matrix.service.name }}/requirements.txt

      - name: Install shared package
        if: matrix.service.changed == 'true' || needs.changes.outputs.shared == 'true'
        run: pip install -e shared/ --quiet

      - name: Install service dependencies
        if: matrix.service.changed == 'true' || needs.changes.outputs.shared == 'true'
        working-directory: ${{ matrix.service.name }}
        run: |
          python -m pip install --upgrade pip
          [ -f requirements.txt ]     && pip install -r requirements.txt
          [ -f requirements-dev.txt ] && pip install -r requirements-dev.txt
          pip install pytest pytest-asyncio pytest-cov httpx anyio

      - name: Run pytest with coverage gate
        if: matrix.service.changed == 'true' || needs.changes.outputs.shared == 'true'
        working-directory: ${{ matrix.service.name }}
        env:
          ENVIRONMENT: test
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: ap-south-1
          DYNAMODB_ENDPOINT_URL: http://localhost:4566
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
        run: |
          python -m pytest tests/ \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            --junit-xml=junit.xml \
            --tb=short \
            -v

      - name: Upload coverage report
        if: always() && (matrix.service.changed == 'true' || needs.changes.outputs.shared == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service.name }}
          path: ${{ matrix.service.name }}/coverage.xml
          retention-days: 14

      - name: Upload test results
        if: always() && (matrix.service.changed == 'true' || needs.changes.outputs.shared == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.service.name }}
          path: ${{ matrix.service.name }}/junit.xml
          retention-days: 14

  build:
    name: Docker Build – ${{ matrix.service }}
    needs: [ unit-tests ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - payment-switch
          - payment-router
          - bank-adapter
          - idempotency-guard

    steps:
      - uses: actions/checkout@v4

      - name: Check Dockerfile exists
        id: df_check
        run: |
          if [ -f "${{ matrix.service }}/Dockerfile" ]; then
            echo "exists=true"  >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "??  No Dockerfile at ${{ matrix.service }}/Dockerfile — skipping."
          fi

      - name: Set up Docker Buildx
        if: steps.df_check.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        if: steps.df_check.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file:    ${{ matrix.service }}/Dockerfile
          push:    false
          tags:    ibts/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to:   type=gha,mode=max,scope=${{ matrix.service }}

  pr-summary:
    name: PR Gate Summary
    needs: [ lint, sast, unit-tests, build ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    permissions:
      pull-requests: write

    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const lint  = '${{ needs.lint.result }}';
            const sast  = '${{ needs.sast.result }}';
            const tests = '${{ needs.unit-tests.result }}';
            const build = '${{ needs.build.result }}';

            const e = r =>
              r === 'success'  ? '?' :
              r === 'skipped'  ? '??' :
              r === 'failure'  ? '?' : '??';

            const nb = '*(non-blocking)*';

            const body = [
              '## PR Gate Results',
              '',
              '| Gate | Status | Blocking? |',
              '|---|---|---|',
              `| Lint (ruff)          | ${e(lint)}  \`${lint}\`  | No ${nb}  |`,
              `| SAST (bandit)        | ${e(sast)}  \`${sast}\`  | No ${nb}  |`,
              `| Tests (pytest + 80%) | ${e(tests)} \`${tests}\` | **Yes**   |`,
              `| Docker Build         | ${e(build)} \`${build}\` | **Yes**   |`,
              '',
              '> ?? Coverage reports, JUnit XML and Bandit JSON uploaded as artifacts above.',
              '> ?? Lint and SAST results are advisory — they do not block merge.',
            ].join('\n');

            // -- on push events there is no PR — skip comment --------------
            if (!context.issue.number) {
              console.log('Push event — no PR to comment on. Skipping summary comment.');
              return;
            }

            const comments = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const prev = comments.data.find(c =>
              c.user.type === 'Bot' && c.body.includes('PR Gate Results')
            );

            if (prev) {
              await github.rest.issues.updateComment({
                comment_id: prev.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
