# Code Generated by Sidekick is for learning and experimentation purposes only.
# filename: .github/workflows/ibts-deploy-all.yml

name: "IBTS Full Deploy"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm running this deployment'
        required: true
        type: string
        default: "no"
      deploy_redis:
        description: "Deploy Redis"
        type: boolean
        default: true
      deploy_mock_bank:
        description: "Deploy Mock Bank Server (WireMock)"
        type: boolean
        default: true
      deploy_bank_adapter:
        description: "Deploy Bank Adapter"
        type: boolean
        default: true
      deploy_idempotency:
        description: "Deploy Idempotency Guard"
        type: boolean
        default: true
      deploy_payment_router:
        description: "Deploy Payment Router"
        type: boolean
        default: true
      deploy_payment_switch:
        description: "Deploy Payment Switch"
        type: boolean
        default: true
      deploy_api_gateway:
        description: "Deploy API Gateway"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "ap-south-2"
  CLUSTER_NAME: "ibts-eks"
  NAMESPACE: "ibts-app"

jobs:
  deploy:
    name: "Deploy IBTS Stack"
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "yes" ]; then
            echo "Deployment halted: confirmation was not yes."
            exit 1
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::149614785419:role/github-actions-terraform-role"
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: "IBTSFullDeploy"

      - name: Connect to EKS Cluster
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"

      - name: Ensure Namespace Exists
        run: kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      # Fail fast: validate every selected manifest before changing anything
      - name: Validate Manifests (server-side dry run)
        env:
          REDIS: ${{ inputs.deploy_redis }}
          MOCK: ${{ inputs.deploy_mock_bank }}
          ADAPTER: ${{ inputs.deploy_bank_adapter }}
          IDEM: ${{ inputs.deploy_idempotency }}
          ROUTER: ${{ inputs.deploy_payment_router }}
          SWITCH: ${{ inputs.deploy_payment_switch }}
          GATEWAY: ${{ inputs.deploy_api_gateway }}
        run: |
          [ "$REDIS" = "true" ]   && kubectl apply --dry-run=server -f .k8s/redis.yaml
          [ "$MOCK" = "true" ]    && kubectl apply --dry-run=server -f .k8s/mock-bank-server.yaml
          [ "$ADAPTER" = "true" ] && kubectl apply --dry-run=server -f .k8s/bank-adapter.yaml
          [ "$IDEM" = "true" ]    && kubectl apply --dry-run=server -f .k8s/idempotency.yaml
          [ "$ROUTER" = "true" ]  && kubectl apply --dry-run=server -f .k8s/payment-router.yaml
          [ "$SWITCH" = "true" ]  && kubectl apply --dry-run=server -f .k8s/payment-switch.yaml
          [ "$GATEWAY" = "true" ] && kubectl apply --dry-run=server -f .k8s/api-gateway.yaml
          echo "All selected manifests validated."

      # 1. Redis (dependency of idempotency-guard)
      - name: Deploy Redis
        if: ${{ inputs.deploy_redis }}
        run: |
          kubectl apply -f .k8s/redis.yaml
          # Add a rollout/wait check here once the Redis kind (Deployment/StatefulSet) is confirmed

      # 2. Mock bank (WireMock) with mappings ConfigMap
      - name: Deploy Mock Bank Server
        if: ${{ inputs.deploy_mock_bank }}
        run: |
          kubectl -n "$NAMESPACE" create configmap wiremock-mappings \
            --from-file=bank-adapter/wiremock/mappings \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f .k8s/mock-bank-server.yaml
          kubectl -n "$NAMESPACE" rollout restart deploy/mock-bank-server
          kubectl -n "$NAMESPACE" rollout status deploy/mock-bank-server --timeout=180s
          kubectl -n "$NAMESPACE" get pods,svc,endpoints -l app=mock-bank-server

      # 3. Bank adapter
      - name: Deploy Bank Adapter
        if: ${{ inputs.deploy_bank_adapter }}
        run: |
          kubectl apply -f .k8s/bank-adapter.yaml
          kubectl -n "$NAMESPACE" rollout status deploy/bank-adapter --timeout=180s
          kubectl -n "$NAMESPACE" get pods,svc,endpoints -l app=bank-adapter

      # 4. Idempotency guard
      - name: Deploy Idempotency Guard
        if: ${{ inputs.deploy_idempotency }}
        run: |
          kubectl apply -f .k8s/idempotency.yaml
          kubectl -n "$NAMESPACE" rollout status deploy/idempotency-guard --timeout=180s
          kubectl -n "$NAMESPACE" get pods,svc,endpoints -l app=idempotency-guard

      # 5. Payment router
      - name: Deploy Payment Router
        if: ${{ inputs.deploy_payment_router }}
        run: |
          kubectl apply -f .k8s/payment-router.yaml
          kubectl -n "$NAMESPACE" rollout status deploy/payment-router --timeout=180s
          kubectl -n "$NAMESPACE" get pods,svc,endpoints -l app=payment-router

      # 6. Payment switch
      - name: Deploy Payment Switch
        if: ${{ inputs.deploy_payment_switch }}
        run: |
          kubectl apply -f .k8s/payment-switch.yaml
          kubectl -n "$NAMESPACE" rollout status deploy/payment-switch --timeout=180s
          kubectl -n "$NAMESPACE" get pods,svc,endpoints -l app=payment-switch

      # 7. API gateway last (entry point), with secrets injected first
      - name: Deploy API Gateway
        if: ${{ inputs.deploy_api_gateway }}
        env:
          API_KEY: ${{ secrets.PROD_API_KEY }}
          JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
        run: |
          kubectl create secret generic api-gateway-secrets \
            -n "$NAMESPACE" \
            --from-literal=API_KEY="$API_KEY" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f .k8s/api-gateway.yaml
          kubectl -n "$NAMESPACE" rollout status deploy/api-gateway --timeout=180s
          kubectl -n "$NAMESPACE" get pods,svc,endpoints -l app=api-gateway

      - name: Debug Info on Failure
        if: ${{ failure() }}
        run: |
          kubectl -n "$NAMESPACE" get pods -o wide || true
          kubectl -n "$NAMESPACE" get events --sort-by=.lastTimestamp | tail -30 || true
