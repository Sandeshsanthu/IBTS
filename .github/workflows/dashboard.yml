# Code Generated by Sidekick is for learning and experimentation purposes only.
# filename: .github/workflows/deploy-observability.yml

name: "IBTS Dashboard"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm deploying the observability stack'
        required: true
        type: string
        default: "no"


permissions:
  id-token: write
  contents: read

# One helm run at a time. Do not cancel in-flight runs: killing helm mid-install
# leaves releases in pending-* state.
concurrency:
  group: observability-deploy
  cancel-in-progress: false

env:
  AWS_REGION: "ap-south-2"
  CLUSTER_NAME: "ibts-eks"
  OBS_NAMESPACE: "ibts-observability"

jobs:
  deploy-observability:
    name: "Import Dashboard"
    # Must match the environment used by terraform.yml so the OIDC `sub` claim
    # (repo:<org>/<repo>:environment:production) matches the role trust policy.
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: ${{ inputs.confirm == 'yes' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::149614785419:role/github-actions-terraform-role"
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: "DeployObservability"

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Configure kubectl
        run: |
          aws eks describe-cluster \
            --region "$AWS_REGION" --name "$CLUSTER_NAME" \
            --query 'cluster.status' --output text
          aws eks update-kubeconfig \
            --region "$AWS_REGION" --name "$CLUSTER_NAME"
          kubectl get nodes



      - name: Require Grafana password secret
        env:
          GRAFANA_PW: ${{ secrets.TF_VAR_GRAFANA_ADMIN_PASSWORD }}
        run: |
          if [[ -z "$GRAFANA_PW" ]]; then
            echo "TF_VAR_GRAFANA_ADMIN_PASSWORD secret is empty; refusing to use the dev fallback in CI"
            exit 1
          fi

      - name: Deploy metrics, logging and tracing
        env:
          TF_VAR_grafana_admin_password: ${{ secrets.TF_VAR_GRAFANA_ADMIN_PASSWORD }}
        run: |
          chmod +x scripts/dashboard.sh
          ./scripts/dashboard.sh

      - name: Dump state on failure
        if: failure()
        run: |
          kubectl get pods,pvc -n "$OBS_NAMESPACE" -o wide || true
          kubectl describe resourcequota -n "$OBS_NAMESPACE" || true
          kubectl get events -n "$OBS_NAMESPACE" --sort-by='.lastTimestamp' | tail -40 || true
          helm list -n "$OBS_NAMESPACE" -a || true
